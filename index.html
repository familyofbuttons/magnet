<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magnetic Mayhem — Widescreen Optimized</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffb347">
<link rel="icon" href="pwa-icons/icon-192.png">

<style>
  *{box-sizing:border-box}
  :root{
    --bg-dark: linear-gradient(180deg,#0a0c0f 0%, #06070a 60%);
    --muted:#bfc4d6;
    --accent:#ffb347;
    --p1:#ff4b6a; --p2:#4da6ff; --p3:#4cd964; --p4:#ffd93b;
    --glass: rgba(255,255,255,0.04);
    --wizard-bg: rgba(250,250,250,0.98);
    --wizard-text: #111;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background: var(--bg-dark);
    color: var(--muted);
    overflow: hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .container{
    width:100%;
    max-width:1800px;
    display:flex;
    flex-direction:column;
    gap:12px;
    height:100vh;
    padding:18px;
    margin:0 auto;
    overflow:auto;
  }

  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-radius:12px;
    background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
    position:sticky;
    top:0;
    z-index:40;
  }

  .title{font-weight:800;color:#fff}
  .subtitle{font-size:0.95rem;color:var(--muted)}
  .controls-inline{display:flex;gap:12px;align-items:center}

  .top-bank{
    padding:12px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
    border:1px solid rgba(255,255,255,0.03);
  }

  .bank-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .bank-controls{display:flex;gap:8px;align-items:center}

  .btn{
    padding:8px 12px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.04);
    color:var(--muted);
    cursor:pointer;
    user-select:none;
  }

  .btn-primary{
    padding:10px 14px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--accent),#ff7b00);
    border:none;
    color:#2b1300;
    font-weight:700;
    cursor:pointer;
  }

  .word-bank{
    position:relative;
    height:320px;
    border-radius:10px;
    margin-top:8px;
    overflow:auto;
    border:1px solid rgba(255,255,255,0.02);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
    padding:8px;
    -webkit-overflow-scrolling: touch;
  }

  .word-magnet{
    position:absolute;
    padding:10px 14px;
    background:#fff;
    color:#111;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    font-weight:800;
    cursor:grab;
    user-select:none;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:1rem;
    touch-action: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  .play-area{
    min-height:720px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
    border:1px solid rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
    padding:12px;
  }

  .player-marker{
    position:absolute;
    width:92px;
    height:92px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    color:#111;
    border:3px solid rgba(255,255,255,0.9);
    box-shadow:0 12px 36px rgba(0,0,0,0.6);
    user-select:none;
    overflow:hidden;
    touch-action: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  .marker-p1{background:var(--p1)}
  .marker-p2{background:var(--p2)}
  .marker-p3{background:var(--p3)}
  .marker-p4{background:var(--p4)}

  /* ensure profile images inside markers don't appear zoomed */
  .marker-img{
    width:78%;
    height:78%;
    object-fit:contain;
    border-radius:50%;
    display:block;
  }

  .wizard-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.6);
    z-index:9999;
  }

  .wizard-card{
    width:92%;
    max-width:980px;
    border-radius:14px;
    padding:20px;
    background:var(--wizard-bg);
    color:var(--wizard-text);
    box-shadow:0 20px 60px rgba(0,0,0,0.7);
  }

  /* --- JAUNTY TILES (restored) --- */
  .jounty-row{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:16px;
  }

  .jounty-tile{
    min-width:120px;
    padding:18px 20px;
    border-radius:14px;
    background:linear-gradient(180deg,#fff,#f3f3f3);
    color:#111;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    border:1px solid rgba(0,0,0,0.06);
    transition: transform .12s ease, box-shadow .12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    user-select:none;
  }

  .jounty-tile.selected{
    transform: translateY(-6px);
    box-shadow:0 18px 40px rgba(0,0,0,0.28);
    background:linear-gradient(180deg,#fff8e6,#fff2d1);
  }

  .jounty-tile.small{
    padding:10px 12px;
    min-width:90px;
    font-weight:700;
  }

  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10010;
  }

  .modal-card{
    width:92%;
    max-width:820px;
    border-radius:14px;
    padding:18px;
    background: linear-gradient(180deg,#ffffff,#fbfbfd);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    color:#111;
    border: 1px solid rgba(0,0,0,0.04);
  }

  .modal-magnet{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:6px 10px;
    margin:4px 6px 4px 0;
    border-radius:999px;
    background: linear-gradient(180deg,#fff,#f3f3f3);
    color:#111;
    font-weight:800;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font-size:0.9rem;
  }

  .rating-grid{ display:flex; flex-direction:column; gap:14px; }
  .rating-row{ display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
  .pill{ appearance:none; border:1px solid rgba(0,0,0,0.06); background:linear-gradient(180deg,#fff,#f7f7f9); padding:8px 10px; border-radius:999px; margin:0 4px; cursor:pointer; font-weight:800; color:#222; transition: transform .08s ease, box-shadow .08s ease, background .12s ease; }
  .pill:hover{ transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,0.12); }
  .pill.selected{ background: linear-gradient(90deg,#ffd93b,#ffb347); color:#2b1300; border-color: rgba(0,0,0,0.08); box-shadow: 0 14px 36px rgba(255,180,60,0.18); }
  .rating-controls{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; min-width:140px; }
  .rating-note{ font-size:0.82rem; color:#666; }
  .score-pill{ display:inline-block; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.06); margin-right:6px; font-weight:700; color:#fff; }

  /* highlight wrapper used for winner / head player */
  .player-highlight{
    box-shadow: 0 0 0 4px rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.25);
    border-radius:12px;
  }
  .player-highlight.p1{ outline: 4px solid rgba(255,75,106,0.18); }
  .player-highlight.p2{ outline: 4px solid rgba(77,166,255,0.18); }
  .player-highlight.p3{ outline: 4px solid rgba(76,217,100,0.18); }
  .player-highlight.p4{ outline: 4px solid rgba(255,217,59,0.18); }

  /* prevent page scroll while dragging on some devices */
  body.dragging-touch { overflow: hidden; touch-action: none; }
</style>
</head>
<body>
<div class="container" id="app">

  <div class="header">
    <div>
      <div class="title">Magnetic Mayhem</div>
      <div class="subtitle">Drag magnets, park your marker, build sentences — then rate the chaos.</div>
    </div>

    <div class="controls-inline">
      <div class="scoreboard" id="scoreboard"></div>
      <div style="width:12px"></div>
      <div class="small" id="themeLabel">Theme: Dark</div>
    </div>
  </div>

  <div class="top-bank">
    <div class="bank-header">
      <div><strong style="color:#fff">Word pool</strong> · Drag magnets into the play area</div>
      <div class="bank-controls">
        <button id="reshuffle" class="btn">New word mix</button>
        <div id="startGameWrap"></div>
        <div style="width:8px"></div>
        <div class="timer-display" id="timerDisplay">Ready</div>
        <div style="width:12px"></div>
        <div class="timer-wrap" title="Time left">
          <div id="timerBar" class="timer-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div id="wordBank" class="word-bank"></div>

    <div class="controls-row">
      <div class="message" id="message">
        Open "New Game" to configure players, rounds and theme.
      </div>
    </div>
  </div>

  <div id="playArea" class="play-area">
    <div class="play-hint">Shared play area — park your marker, then drag words near it.</div>
  </div>

</div>

<div id="wizard" class="wizard-overlay" style="display:none">
  <div class="wizard-card" id="wizardCard"></div>
</div>

<script>
(function(){

const PROFILE_KEY = 'mm_profiles_jounty';
const SCORE_KEY = 'mm_scores_jounty';
const POOL_SIZE = 10000;
const ROUND_WORD_COUNT = 200;
const VISIBLE_MAGNETS = 300;
const SENSIBLE_PHRASES = [
  "chicken nugget","starbucks coffee","french toast","cheese grater","coffee shop","train station",
  "post office","phone charger","garden gate","garden shed","movie theater","bus stop","school bus",
  "apple pie","banana bread","chocolate cake","ice cream","paper towel","toilet paper","dinner table",
  "kitchen sink","front door","back yard","living room","bed room","breakfast cereal","lunch box",
  "dinner plate","safety pin","first aid","credit card","bank account","movie night","game night",
  "shopping list","grocery store","coffee mug","water bottle","phone case","car keys","house key",
  "train ticket","flight ticket","hotel room","office chair","desk lamp","reading lamp","study desk",
  "georgie","leslie","beverley","allen","house","home","family",
  "cat","dog","potato","nipple","frog","hammer","guitar","plant pot","dressing gown","pizza","indian takeaway",
  "glitter","cheese pants","jumper","kettle","pills","drugs","music","bath","soap","tree","flower","watch","alexa",
  "bleach","car","bus","train","plane"
];

const SEED = [
  "allen","gray","beverley","leslie","christine","alex","sam","taylor","jordan","riley",
  "casey","mandy","moany",
  "I","I","you","he","she","they","we","it","someone","everyone","nobody",
  "a","an","the","this","that","these","those","my","your","our","their",
  "is","are","was","were","has","have","had","does","do","did","its","it's","isn't","hasn't","needs","need",
  "because","if","but","though","through",
  "and","or","but","if","because","while","when","then","so",
  "cat","dog","dragon","robot","teacher","wizard","pirate","ghost","monster",
  "sandwich","pizza","tea","coffee","cake","sofa","toaster","fridge","banana",
  "run","jump","dance","sing","whisper","shout","laugh","cry","sleep","wash","kneel","drown","cook","bake","brew","make",
  "tiny","huge","sparkly","grumpy","sleepy","noisy","silent","awkward","brilliant","ridiculous",
  "rude","cheeky","horrible","stinky",
  "on","under","over","inside","outside","behind","next","between","around","before",
  "pancake","marshmallow","llama","unicorn","spaceship","cupboard","sock","spoon","noodle","pudding",
  "glitter","chaos","nonsense","mischief","giggle","hiccup","sneeze","burp","rumble","whirlwind",
  "legendary","impossible","unexpected","epic","wonky","secret","plan","accident","story","memory",
  "boobies","balls","muff","willy","porn","booze","vodka","beer",
  "uncle","aunty","sister","brother","dad","mum",
  "like","hate",
  "port talbot","swansea","wales","england","reading","swindon","america","australia",
  "cat","dog","potato","nipple","frog","hammer","guitar","plant","pot","dressing","gown","pizza","glitter","cheese","pants","jumper","kettle","pills","drugs","music","bath","soap","tree","flower","watch","alexa","bleach","car","bus","train","plane"
];

const ING_WORDS = [
  "running","jumping","dancing","singing","whispering","shouting","laughing","crying","sleeping","eating",
  "building","breaking","spinning","floating","glowing","searching","finding","carrying","holding","pushing",
  "pulling","smiling","frowning","cooking","baking","driving","walking","skipping","painting","drawing",
  "typing","scrolling","listening","talking","breathing","splashing","sneezing",
  "sleeping","washing","kneeling","drowning","brewing","making","cooked","baked","brewed",
  "ing","ed","er","es","s","ly","end"
];

const PUNCTUATION = ['.', ',', '?', '!'];

/* Reduced connectors list (fewer repeats) but still present each game */
const CONNECTORS = [
  'a','a',
  'it','it',
  'was','was',
  'at','at',
  'and','and',
  's','ed','er',
  'in','of','on',
  'if','when','why','how'
];

function buildBigPool(){
  if(BIG_POOL) return BIG_POOL;

  const adjectives = ["bright","dull","fuzzy","slick","ancient","modern","weird","sudden","quiet","loud","mellow","spicy","bitter","sweet","mystic","rusty","neon","frozen","gentle","brave","calm","wild","sly","bold","soft","sharp","warm","cold","golden","silver","rainbow","colourful","stinky","rude","cheeky"];
  const nouns = ["box","chair","river","mountain","lamp","shoe","hat","phone","keyboard","monitor","bottle","window","door","road","cloud","island","bridge","garden","stone","leaf","star","ship","tower","bench","book","street","market","forest","field","ocean","uncle","aunty","sister","brother","dad","mum","beer","vodka","booze","cat","dog","potato","nipple","frog","hammer","guitar","plant","pot","dressing","gown","pizza","glitter","cheese","pants","jumper","kettle","pills","drugs","music","bath","soap","tree","flower","watch","alexa","bleach","car","bus","train","plane"];
  const verbs = ["run","jump","dance","sing","whisper","shout","laugh","cry","sleep","eat","build","break","spin","float","glow","search","find","carry","hold","push","pull","wash","kneel","drown","cook","bake","brew","make"];

  const pool = SEED.slice();

  for(let w of ING_WORDS) pool.push(w);
  for(let p of PUNCTUATION) pool.push(p);

  // Add connectors but fewer repeats than before
  for(let c of CONNECTORS) pool.push(c);

  for(let i=0;i<3000;i++){
    const pick = (i % 3 === 0)
      ? adjectives[i % adjectives.length]
      : (i % 3 === 1 ? nouns[i % nouns.length] : verbs[i % verbs.length]);
    pool.push(pick);
  }

  for(let p of SENSIBLE_PHRASES) pool.push(p);

  const EXTRA = [
    "more","and","it","is","was","has","had","her","she","him","he","they","them","that","this","in","at","of","coz","per","else","than","if","but",
    "because","all","it's","wasn't","isn't","hasn't","to","through","though","were","I"
  ];
  for(let e of EXTRA) pool.push(e);

  let i = 0;
  while(pool.length < POOL_SIZE){
    const pick = (i % 2 === 0)
      ? nouns[i % nouns.length]
      : adjectives[i % adjectives.length];
    pool.push(pick);
    i++;
    if(i > 50000) break;
  }

  const uniq = Array.from(new Set(pool)).slice(0, POOL_SIZE);
  shuffle(uniq);
  BIG_POOL = uniq;
  return BIG_POOL;
}

function applyTheme(name){
  chosenTheme = name;
  themeLabel.textContent = 'Theme: ' + ({
    dark:'Dark',
    pastel:'Pastel',
    rainbow:'Rainbow',
    xmas:'Christmas',
    light:'Light',
    random:'Random'
  }[name] || name);

  if(name==='pastel'){
    document.body.style.background = 'linear-gradient(180deg,#ffe6ff 0%, #fff7f0 60%)';
    document.documentElement.style.setProperty('--muted','#6b5b6b');
    document.documentElement.style.setProperty('--accent','#ff9ec3');
  }
  else if(name==='rainbow'){
    document.body.style.background = 'linear-gradient(135deg,#ff4b6a 0%, #ffb347 25%, #ffd93b 50%, #4cd964 75%, #4da6ff 100%)';
    document.documentElement.style.setProperty('--muted','#f5f5ff');
    document.documentElement.style.setProperty('--accent','#ff4b6a');
  }
  else if(name==='xmas'){
    document.body.style.background = 'linear-gradient(180deg,#07220f 0%, #0b3b1a 60%)';
    document.documentElement.style.setProperty('--muted','#cfe8d8');
    document.documentElement.style.setProperty('--accent','#ff4b4b');
  }
  else if(name==='light'){
    document.body.style.background = 'linear-gradient(180deg,#f6f9fc 0%, #eef6ff 60%)';
    document.documentElement.style.setProperty('--muted','#4b6b8b');
    document.documentElement.style.setProperty('--accent','#7fb3ff');
  }
  else{
    document.body.style.background = 'linear-gradient(180deg,#0a0c0f 0%, #06070a 60%)';
    document.documentElement.style.setProperty('--muted','#bfc4d6');
    document.documentElement.style.setProperty('--accent','#ffb347');
  }
}
function openWizard(){
  try{
    document.querySelectorAll('.modal-backdrop').forEach(n=>{
      if(n && n.parentNode) n.parentNode.removeChild(n);
    });
  }catch(e){}

  wizard.style.display = 'flex';
  wizard.style.pointerEvents = 'auto';
  wizard.style.zIndex = '10050';

  wizardStep = 0;
  uploadedImages = [null,null,null,null];

  wizardCard.innerHTML = '';
  renderWizard();

  setTimeout(()=>{
    const startBtn = document.getElementById('startNew');
    if(startBtn) startBtn.focus();
  }, 60);
}

function renderWizard(){
  wizardCard.innerHTML = '';

  if(wizardStep === 0){
    wizardCard.innerHTML = `
      <div style="text-align:center">
        <div style="font-size:1.6rem;font-weight:900;color:#111">Magnetic Mayhem</div>
        <div class="small" style="color:#444;margin-top:6px">Choose players, rounds, time and theme — then begin.</div>
        <div class="jounty-row" style="margin-top:18px">
          <div id="startNew" class="jounty-tile">New Game</div>
        </div>
      </div>`;
    $('#startNew', wizardCard).addEventListener('click', ()=>{
      wizardStep=1;
      renderWizard();
    });
    return;
  }

  if(wizardStep === 1){
    wizardCard.innerHTML = `
      <div style="text-align:center">
        <div style="font-size:1.2rem;font-weight:800;color:#111">Players</div>
        <div class="small" style="color:#333;margin-top:6px">Select how many players will play</div>
        <div class="jounty-row" id="playerRow"></div>
        <div style="margin-top:12px">
          <div id="toTime" class="jounty-tile">Next</div>
        </div>
      </div>`;

    const row = $('#playerRow', wizardCard);
    [1,2,3,4].forEach(n=>{
      const el = document.createElement('div');
      el.className='jounty-tile';
      el.textContent = n + (n>1 ? ' Players' : ' Player');
      el.dataset.val = n;
      if(n === chosenPlayers) el.classList.add('selected');
      el.addEventListener('click', ()=>{
        chosenPlayers = n;
        Array.from(row.children).forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
      row.appendChild(el);
    });

    $('#toTime', wizardCard).addEventListener('click', ()=>{
      wizardStep=2;
      renderWizard();
    });
    return;
  }

  if(wizardStep === 2){
    wizardCard.innerHTML = `
      <div style="text-align:center">
        <div style="font-size:1.2rem;font-weight:800;color:#111">Rounds & Time</div>
        <div class="small" style="color:#333;margin-top:6px">Choose number of rounds and round length</div>

        <div style="display:flex;gap:18px;justify-content:center;margin-top:12px">
          <div>
            <div style="font-weight:800;color:#111;margin-bottom:8px">Rounds</div>
            <div class="jounty-row" id="roundRow"></div>
          </div>

          <div>
            <div style="font-weight:800;color:#111;margin-bottom:8px">Time</div>
            <div class="jounty-row" id="timeRow"></div>
          </div>
        </div>

        <div class="wizard-actions" style="margin-top:14px">
          <div id="toTheme" class="jounty-tile">Next</div>
          <div id="backToPlayers" class="jounty-tile">Back</div>
        </div>
      </div>`;

    const roundRow = $('#roundRow', wizardCard);
    [2,4,5,10].forEach(r=>{
      const el = document.createElement('div');
      el.className='jounty-tile';
      el.textContent = r + ' Rounds';
      el.dataset.val = r;
      if(r === chosenRounds) el.classList.add('selected');
      el.addEventListener('click', ()=>{
        chosenRounds = r;
        Array.from(roundRow.children).forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
      roundRow.appendChild(el);
    });

    const timeRow = $('#timeRow', wizardCard);
    [60,90,120].forEach(t=>{
      const el = document.createElement('div');
      el.className='jounty-tile';
      el.textContent = t + 's';
      el.dataset.val = t;
      if(t === chosenTime) el.classList.add('selected');
      el.addEventListener('click', ()=>{
        chosenTime = t;
        Array.from(timeRow.children).forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
      timeRow.appendChild(el);
    });

    $('#toTheme', wizardCard).addEventListener('click', ()=>{
      wizardStep=3;
      renderWizard();

      renderWizard();

// --- PROFILE STORAGE --------------------------------------------------------

function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    if(!raw) return [];
    return JSON.parse(raw);
  }catch(e){
    return [];
  }
}

function saveProfiles(list){
  try{
    localStorage.setItem(PROFILE_KEY, JSON.stringify(list));
  }catch(e){}
}

function addOrUpdateProfile(pr){
  const list = loadProfiles();
  const idx = list.findIndex(x=>x.id===pr.id);
  if(idx>=0) list[idx] = pr;
  else list.push(pr);
  saveProfiles(list);
}

function deleteProfile(id){
  const list = loadProfiles().filter(x=>x.id!==id);
  saveProfiles(list);
}

function setupBoard(){

function clearBoard(){
  magnets.forEach(m=>{
    if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el);
  });
  magnets = [];

  markers.forEach(m=>{
    if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el);
  });
  markers = [];

  magnetId = 1;
}

function generateWordMagnets(){
  wordBank.innerHTML = '';

  magnets.forEach(m=>{
    if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el);
  });
  magnets = [];
  magnetId = 1;

  const pool = buildBigPool();

  // Ensure we include a modest number of connectors (reduced) and more 'things'
  const chosen = [];

  // Always include a selection of COMMON_WORDS (allow duplicates for connectors but limited)
  for(let w of COMMON_WORDS){
    chosen.push(w);
  }

  // Add a small number of explicit connector repeats to guarantee multiple connecting words but not too many
  for(let c of CONNECTORS){
    if(Math.random() < 0.5){
      chosen.push(c);
    }
  }

  // Add more 'things' (nouns/items) to increase variety
  const things = ["cat","dog","potato","nipple","frog","hammer","guitar","plant","pot","dressing","gown","pizza","glitter","cheese","pants","jumper","kettle","pills","drugs","music","bath","soap","tree","flower","watch","alexa","bleach","car","bus","train","plane"];
  for(let t of things){
    if(Math.random() < 0.85) chosen.push(t);
  }

  // Fill up to ROUND_WORD_COUNT with random picks (allow duplicates)
  while(chosen.length < ROUND_WORD_COUNT){
    const idx = Math.floor(Math.random() * pool.length);
    chosen.push(pool[idx]);
  }

  shuffle(chosen);

  const visibleCount = Math.min(VISIBLE_MAGNETS, chosen.length);
  const bankRect = wordBank.getBoundingClientRect();
  const bankW = Math.max(600, bankRect.width || 1200);
  const bankH = Math.max(220, bankRect.height || 320);

  for(let i=0;i<visibleCount;i++){
    const text = chosen[i];
    const el = document.createElement('div');
    el.className='word-magnet';
    el.innerHTML = `<div class="magnet-text">${escapeHtml(text)}</div>`;

    const angle = Math.round(rand(-6,6));
    const scale = (rand(0.99,1.01)).toFixed(2);
    const x = Math.round(rand(8, bankW - 160));
    const y = Math.round(rand(6, bankH - 48));

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = `rotate(${angle}deg) scale(${scale})`;

    wordBank.appendChild(el);

    const magnet = {
      id:magnetId++,
      text,
      el,
      inPlay:false,
      x,
      y,
      angle
    };

    magnets.push(magnet);
    makeMagnetDraggable(magnet);
  }
}
// --- DRAGGING LOGIC (pointer + touch friendly) -----------------------------
function makeMagnetDraggable(magnet){
  const el = magnet.el;
  let dragging=false, offsetX=0, offsetY=0, activePointerId = null;

  function startDrag(clientX, clientY, pointerId){
    dragging = true;
    activePointerId = pointerId || null;
    el.style.zIndex = 9999;
    document.body.classList.add('dragging-touch');

    const r = el.getBoundingClientRect();
    offsetX = clientX - r.left;
    offsetY = clientY - r.top;

    el.classList.add('dragging');
    wordBank.classList.add('drag-over-candidate');
  }

  function endDrag(){
    if(!dragging) return;
    dragging = false;
    activePointerId = null;
    el.style.zIndex = 1;
    el.classList.remove('dragging');
    wordBank.classList.remove('drag-over');
    wordBank.classList.remove('drag-over-candidate');
    document.body.classList.remove('dragging-touch');
  }

  function onPointerDown(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    startDrag(e.clientX, e.clientY, e.pointerId);
  }

  function onPointerMove(e){
    if(!dragging) return;
    if(activePointerId !== null && e.pointerId !== activePointerId) return;
    e.preventDefault();

    let x = e.clientX - offsetX;
    let y = e.clientY - offsetY;

    const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
    const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);

    x = clamp(x, 0, vw - el.offsetWidth);
    y = clamp(y, 0, vh - el.offsetHeight);

    if(!magnet._absolute){
      magnet._absolute = true;
      document.body.appendChild(el);
    }

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    magnet.x = x;
    magnet.y = y;

    const bankRect = wordBank.getBoundingClientRect();
    if(e.clientX >= bankRect.left && e.clientX <= bankRect.right &&
       e.clientY >= bankRect.top && e.clientY <= bankRect.bottom){
      wordBank.classList.add('drag-over');
    } else {
      wordBank.classList.remove('drag-over');
    }
  }

  function onPointerUp(e){
    if(activePointerId !== null && e.pointerId !== activePointerId) return;
    try{ el.releasePointerCapture(e.pointerId); }catch(err){}
    // compute center and decide playArea vs wordBank placement
    const centerX = magnet.x + el.offsetWidth/2;
    const centerY = magnet.y + el.offsetHeight/2;

    const playRect = playArea.getBoundingClientRect();
    const bankRect = wordBank.getBoundingClientRect();

    if(centerX >= playRect.left && centerX <= playRect.right &&
       centerY >= playRect.top && centerY <= playRect.bottom){

      const localX = centerX - playRect.left - el.offsetWidth/2;
      const localY = centerY - playRect.top - el.offsetHeight/2;

      magnet.inPlay = true;
      magnet.x = clamp(localX, 0, playRect.width - el.offsetWidth);
      magnet.y = clamp(localY, 0, playRect.height - el.offsetHeight);

      playArea.appendChild(el);
      el.style.left = magnet.x + 'px';
      el.style.top = magnet.y + 'px';
      magnet._absolute = false;
      endDrag();
      return;
    }

    if(centerX >= bankRect.left && centerX <= bankRect.right &&
       centerY >= bankRect.top && centerY <= bankRect.bottom){

      const x = Math.round(rand(8, Math.max(80, bankRect.width - 160)));
      const y = Math.round(rand(6, Math.max(20, bankRect.height - 48)));

      magnet.inPlay = false;
      magnet.x = x;
      magnet.y = y;

      wordBank.appendChild(el);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      magnet._absolute = false;
      endDrag();
      return;
    }

    if(magnet.inPlay){
      const playRect2 = playArea.getBoundingClientRect();
      magnet.x = clamp(magnet.x, 0, playRect2.width - el.offsetWidth);
      magnet.y = clamp(magnet.y, 0, playRect2.height - el.offsetHeight);
      playArea.appendChild(el);
      el.style.left = magnet.x + 'px';
      el.style.top = magnet.y + 'px';
      magnet._absolute = false;
    } else {
      const bankRect2 = wordBank.getBoundingClientRect();
      const x = Math.round(rand(8, Math.max(80, bankRect2.width - 160)));
      const y = Math.round(rand(6, Math.max(20, bankRect2.height - 48)));

      magnet.inPlay = false;
      magnet.x = x;
      magnet.y = y;
      wordBank.appendChild(el);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      magnet._absolute = false;
    }
    endDrag();
  }

  // Touch fallback
  function onTouchStart(ev){
    if(ev.touches && ev.touches.length){
      const t = ev.touches[0];
      ev.preventDefault();
      startDrag(t.clientX, t.clientY, 'touch');
    }
  }
  function onTouchMove(ev){
    if(!dragging) return;
    if(ev.touches && ev.touches.length){
      const t = ev.touches[0];
      ev.preventDefault();
      let x = t.clientX - offsetX;
      let y = t.clientY - offsetY;

      const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
      const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);

      x = clamp(x, 0, vw - el.offsetWidth);
      y = clamp(y, 0, vh - el.offsetHeight);

      if(!magnet._absolute){
        magnet._absolute = true;
        document.body.appendChild(el);
      }

      el.style.left = x + 'px';
      el.style.top = y + 'px';
      magnet.x = x;
      magnet.y = y;

      const bankRect = wordBank.getBoundingClientRect();
      if(t.clientX >= bankRect.left && t.clientX <= bankRect.right &&
         t.clientY >= bankRect.top && t.clientY <= bankRect.bottom){
        wordBank.classList.add('drag-over');
      } else {
        wordBank.classList.remove('drag-over');
      }
    }
  }
  function onTouchEnd(ev){
    if(!dragging) return;
    ev.preventDefault();
    // call pointer up logic
    onPointerUp({ pointerId: activePointerId });
  }

  el.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp, { passive: false });

  el.addEventListener('touchstart', onTouchStart, { passive: false });
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend', onTouchEnd, { passive: false });
  window.addEventListener('touchcancel', onTouchEnd, { passive: false });
}

  function onTouchStart(ev){

  }
  function onTouchEnd(ev){
    if(!dragging) return;

  }

  el.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp, { passive: false });

  el.addEventListener('touchstart', onTouchStart, { passive: false });
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend', onTouchEnd, { passive: false });
  window.addEventListener('touchcancel', onTouchEnd, { passive: false });
}

// --- ROUND FLOW -------------------------------------------------------------
function startRound(){
  if(roundActive) return;

  if(currentRound === 0){
    setupBoard();
  }

  roundActive = true;
  currentRound++;
  totalRounds = chosenRounds;

  timeLeft = chosenTime;
  timerDisplay.textContent = timeLeft + 's';
  updateTimerBar();

  setMessage(`Round ${currentRound}/${totalRounds} started — ${timeLeft}s`);

  if(timer) clearInterval(timer);

  timer = setInterval(()=>{
    timeLeft--;
    timerDisplay.textContent = timeLeft + 's';
    updateTimerBar();

    if(timeLeft <= 0){
      clearInterval(timer);
      timer = null;
      endRound();
    }
  },1000);
}

function updateTimerBar(){
  const pct = Math.max(0, Math.min(1, timeLeft / chosenTime));
  timerBar.style.width = (pct*100) + '%';

  if(pct < 0.25){
    timerBar.style.filter = 'hue-rotate(-20deg) saturate(1.2)';
  } else {
    timerBar.style.filter = '';
  }
}

function endRound(){
  roundActive = false;
  timerDisplay.textContent = '0s';
  timerBar.style.width = '0%';

  setMessage('Time! Freezing board and computing sentences...');

  magnets.forEach(m=>{
    if(m.el) m.el.style.pointerEvents = 'none';
  });

  markers.forEach(m=>{
    if(m.el) m.el.style.pointerEvents = 'none';
  });

  setTimeout(()=>{ openRatingsModal(); }, 200);
}
// --- CLUSTERING, SENTENCES, RATINGS ----------------------------------------

function clusterMagnets(eps){
  const threshold = eps || 140;
  const inPlay = magnets.filter(m => m.inPlay && m.el);
  const visited = new Set();
  const clusters = [];

  function centerOf(m){
    return {
      x: m.x + (m.el ? m.el.offsetWidth/2 : 0),
      y: m.y + (m.el ? m.el.offsetHeight/2 : 0)
    };
  }

  function dist(a,b){
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  for(let i=0;i<inPlay.length;i++){
    const start = inPlay[i];
    if(visited.has(start)) continue;
    const queue = [start];
    visited.add(start);
    const cluster = [];
    while(queue.length){
      const cur = queue.shift();
      cluster.push(cur);
      const ccur = centerOf(cur);
      for(let j=0;j<inPlay.length;j++){
        const other = inPlay[j];
        if(visited.has(other)) continue;
        const cother = centerOf(other);
        if(dist(ccur, cother) <= threshold){
          visited.add(other);
          queue.push(other);
        }
      }
    }
    if(cluster.length) clusters.push(cluster);
  }

  return clusters;
}

function assignClustersToMarkers(clusters){
  const assigned = Array.from({length: chosenPlayers}, ()=>[]);
  if(!markers || markers.length === 0) return assigned;

  clusters.forEach(cluster=>{
    let cx = 0, cy = 0;
    cluster.forEach(m=>{
      cx += m.x + (m.el ? m.el.offsetWidth/2 : 0);
      cy += m.y + (m.el ? m.el.offsetHeight/2 : 0);
    });
    cx /= cluster.length;
    cy /= cluster.length;

    let bestIdx = 0;
    let bestDist = Infinity;
    markers.forEach((mk, idx)=>{
      const mx = mk.x + (mk.el ? mk.el.offsetWidth/2 : 0);
      const my = mk.y + (mk.el ? mk.el.offsetHeight/2 : 0);
      const dx = mx - cx;
      const dy = my - cy;
      const d = Math.sqrt(dx*dx + dy*dy);
      if(d < bestDist){
        bestDist = d;
        bestIdx = idx;
      }
    });

    assigned[bestIdx].push(cluster);
  });

  return assigned;
}

function orderMagnetsRowMajor(cluster){
  if(!cluster || !cluster.length) return [];
  const tolerance = 40;
  const copy = cluster.slice();
  copy.sort((a,b)=>{
    const ay = a.y, by = b.y;
    if(Math.abs(ay - by) > tolerance) return ay - by;
    return a.x - b.x;
  });
  return copy;
}

function openRatingsModal(){
  const clusters = clusterMagnets(140);
  if(!clusters.length){
    setMessage('No sentences detected this round. Skipping ratings.');
    showWinnerAndAdvance(null);
    return;
  }

  const byPlayer = assignClustersToMarkers(clusters);

  const sentencesByPlayer = byPlayer.map(playerClusters=>{
    const out = [];
    playerClusters.forEach(cluster=>{
      const ordered = orderMagnetsRowMajor(cluster);
      const text = ordered.map(m => m.text).join(' ').trim();
      if(text) out.push({magnets: ordered, text});
    });
    return out;
  });

  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  const card = document.createElement('div');
  card.className = 'modal-card';

  let html = `<div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:900;font-size:1.2rem">Rate the chaos</div>
      <div style="font-size:0.9rem;color:#666">Round ${currentRound}/${totalRounds}</div>
    </div>
    <div style="margin-top:8px;font-size:0.95rem;color:#444">Review each player’s sentences and give them a score for this round.</div>
    <div class="rating-grid" style="margin-top:12px">`;

  for(let p=0;p<chosenPlayers;p++){
    const sentences = sentencesByPlayer[p] || [];
    const name = escapeHtml(playerNames[p] || ('P'+(p+1)));

    html += `<div class="rating-row" data-player="${p}" style="padding:10px;border-radius:10px">`;

    html += `<div style="flex:1;min-width:0">
      <div style="font-weight:800;margin-bottom:6px">${name}</div>`;

    if(sentences.length === 0){
      html += `<div style="font-size:0.85rem;color:#666">No sentences.</div>`;
    } else {
      sentences.forEach(s=>{
        html += `<div style="margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center">`;
        s.magnets.forEach(m=>{
          html += `<span class="modal-magnet">${escapeHtml(m.text)}</span>`;
        });
        html += `</div>`;
      });
    }

    html += `</div>`;

    html += `<div class="rating-controls" data-player="${p}">
      <div class="rating-note">Round score</div>
      <div style="display:flex;gap:6px">`;
    for(let score=1;score<=5;score++){
      html += `<button class="pill" data-player="${p}" data-score="${score}">${score}</button>`;
    }
    html += `</div></div></div>`;
  }

  html += `</div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px;gap:10px">
      <button id="ratingsCancel" class="btn">Skip ratings</button>
      <div id="ratingsSubmit" class="jounty-tile">Submit ratings</div>
    </div>`;

  card.innerHTML = html;
  modal.appendChild(card);
  document.body.appendChild(modal);

  // visually add player color highlights to rating rows (pre-submit)
  for(let p=0;p<chosenPlayers;p++){
    const row = card.querySelector(`.rating-row[data-player="${p}"]`);
    if(row){
      row.classList.add('player-highlight');
      row.classList.add('p' + (p+1));
    }
  }

  const ratingsMap = {};

  card.querySelectorAll('.pill').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const b = ev.currentTarget;
      const player = parseInt(b.dataset.player, 10);
      const score = parseInt(b.dataset.score, 10);
      ratingsMap[player] = score;
      card.querySelectorAll(`.pill[data-player="${player}"]`).forEach(p=>p.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  const submitBtn = card.querySelector('#ratingsSubmit');
  const cancelBtn = card.querySelector('#ratingsCancel');

  submitBtn.addEventListener('click', ()=>{
    const deltas = Array.from({length: chosenPlayers}, ()=>0);
    Object.keys(ratingsMap).forEach(k=>{
      const idx = parseInt(k,10);
      deltas[idx] = ratingsMap[idx] || 0;
    });

    const anyRated = deltas.some(d => d !== 0);
    if(!anyRated){
      setMessage('No ratings given — skipping scoring for this round.');
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      showWinnerAndAdvance(null);
      return;
    }

    for(let i=0;i<chosenPlayers;i++){
      scores[i] = (scores[i] || 0) + (deltas[i] || 0);
    }

    let max = -Infinity;
    for(let i=0;i<chosenPlayers;i++) if(deltas[i] > max) max = deltas[i];
    const topIndexes = [];
    for(let i=0;i<chosenPlayers;i++){
      if(deltas[i] === max && max > 0) topIndexes.push(i);
    }

    if(topIndexes.length > 1){
      topIndexes.forEach(i => { scores[i] = (scores[i] || 0) + max; });
    }

    saveScores(scores);
    updateScoreboard();

    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);

    if(topIndexes.length > 1){
      showWinnerAndAdvance(topIndexes);
    } else if(topIndexes.length === 1){
      showWinnerAndAdvance(topIndexes[0]);
    } else {
      showWinnerAndAdvance(null);
    }
  });

  cancelBtn.addEventListener('click', ()=>{
    setMessage('Ratings skipped. No score changes this round.');
    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
    showWinnerAndAdvance(null);
  });

  function onKey(e){
    if(e.key === 'Escape'){
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      window.removeEventListener('keydown', onKey);
      showWinnerAndAdvance(null);
    }
  }
  window.addEventListener('keydown', onKey);
}

function showWinnerAndAdvance(winnerData){
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  const card = document.createElement('div');
  card.className = 'modal-card';

  let title = `Round ${currentRound}/${totalRounds} complete`;
  let body = '';

  if(winnerData == null){
    body += `<div style="margin-top:8px;font-size:0.95rem;color:#444">No ratings this round.</div>`;
  } else if(Array.isArray(winnerData) && winnerData.length > 1){
    const names = winnerData.map(i => escapeHtml(playerNames[i] || ('P'+(i+1))));
    const list = names.join(' and ');
    body += `<div style="margin-top:8px;font-size:1rem">Draw — ${list} each get +${scores[winnerData[0]]}</div>`;
  } else {
    const idx = Array.isArray(winnerData) ? winnerData[0] : winnerData;
    const wName = escapeHtml(playerNames[idx] || ('P'+(idx+1)));
    body += `<div style="margin-top:8px;font-size:1rem">${wName} won that round</div>`;
  }

  const isLastRound = currentRound >= totalRounds;

  body += `<div style="margin-top:14px;font-size:0.9rem;color:#555">${isLastRound ? 'That was the final round.' : 'Get ready for the next round.'}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px;gap:8px">
      ${isLastRound ? '<div id="roundFinalScores" class="jounty-tile">View final scores</div>' : '<div id="roundNext" class="jounty-tile">Next round</div>'}
      <button id="roundClose" class="btn">Close</button>
    </div>`;

  card.innerHTML = `<div style="font-weight:900;font-size:1.2rem">${title}</div>${body}`;
  modal.appendChild(card);
  document.body.appendChild(modal);

  // highlight winner(s) visually on the modal
  if(winnerData != null){
    const winners = Array.isArray(winnerData) ? winnerData : [winnerData];
    winners.forEach(wi=>{
      const tile = document.createElement('div');
      tile.className = 'jounty-tile player-highlight p' + (wi+1);
      tile.style.marginTop = '12px';
      tile.style.display = 'inline-block';
      tile.textContent = (playerNames[wi] || ('P'+(wi+1))) + ' — +' + (scores[wi]||0);
      card.appendChild(tile);
    });
  }

  const closeModal = ()=>{ if(modal && modal.parentNode) modal.parentNode.removeChild(modal); };

  const nextBtn = card.querySelector('#roundNext');
  const finalBtn = card.querySelector('#roundFinalScores');
  const closeBtn = card.querySelector('#roundClose');

  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      closeModal();
      resetForNextRound();
    });
  }
  if(finalBtn){
    finalBtn.addEventListener('click', ()=>{
      closeModal();
      showFinalResults();
    });
  }
  if(closeBtn){
    closeBtn.addEventListener('click', ()=>{
      closeModal();
      if(!isLastRound) resetForNextRound(); else showFinalResults();
    });
  }

  function onKey(e){
    if(e.key==='Escape'){
      closeModal();
      window.removeEventListener('keydown', onKey);
      if(!isLastRound) resetForNextRound(); else showFinalResults();
    }
  }
  window.addEventListener('keydown', onKey);
}

function resetForNextRound(){
  roundActive = false;

  magnets.forEach(m=>{ if(m.el) m.el.style.pointerEvents = 'auto'; });
  markers.forEach(m=>{ if(m.el) m.el.style.pointerEvents = 'auto'; });

  if(currentRound < totalRounds){
    generateWordMagnets();
    timeLeft = chosenTime;
    timerDisplay.textContent = 'Ready';
    timerBar.style.width = '0%';
    timerBar.style.filter = '';
    renderStartButton();
    setMessage(`Round ${currentRound+1}/${totalRounds} — press Start Game when ready.`);
  } else {
    setMessage('All rounds complete. View final scores.');
    showFinalResults();
  }
}

function showFinalResults(){
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  const card = document.createElement('div');
  card.className = 'modal-card';

  card.innerHTML = `<div style="font-weight:900;font-size:1.2rem">Game Over — Final Scores</div>
    <div style="margin-top:12px">${renderScoreboardInline(true)}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px;gap:8px">
      <div id="finalRestart" class="jounty-tile">New Game</div>
      <div id="finalClose" class="btn">Close</div>
    </div>`;

  modal.appendChild(card);
  document.body.appendChild(modal);

  function doFullReset(){
    try{
      document.querySelectorAll('.modal-backdrop').forEach(n=>{
        if(n && n.parentNode) n.parentNode.removeChild(n);
      });
    }catch(e){}

    saveScores(scores);
    updateScoreboard();

    currentRound = 0;
    totalRounds = chosenRounds;

    clearBoard();
    renderStartButton();

    setMessage('Game reset. Opening setup wizard...');
    setTimeout(()=>{
      const w = document.getElementById('wizard');
      if(w){
        w.style.display = 'flex';
        w.style.pointerEvents = 'auto';
      }
      if(typeof openWizard === 'function'){
        openWizard();
      } else {
        const card = document.getElementById('wizardCard');
        if(card) card.innerHTML = '';
      }
    }, 80);
  }

  const restartBtn = card.querySelector('#finalRestart');
  if(restartBtn) restartBtn.addEventListener('click',(ev)=>{
    ev.preventDefault();
    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
    doFullReset();
  });

  const closeBtn = card.querySelector('#finalClose');
  if(closeBtn) closeBtn.addEventListener('click',(ev)=>{
    ev.preventDefault();
    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
    setMessage('Final scores shown. Press New Game to start again.');
  });

  function onKey(e){
    if(e.key==='Escape'){
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      window.removeEventListener('keydown', onKey);
    }
  }
  window.addEventListener('keydown', onKey);
}

function updateScoreboard(){
  scoreboardEl.innerHTML = '';
  for(let i=0;i<chosenPlayers;i++){
    const pill = document.createElement('div');
    pill.className = 'score-pill';
    pill.textContent = `${playerNames[i] || ('P'+(i+1))}: ${scores[i] || 0}`;
    scoreboardEl.appendChild(pill);
  }
}

function renderScoreboardInline(showLabels){
  let html = '';
  for(let i=0;i<chosenPlayers;i++){
    html += `<div style="display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,0.04);margin-right:6px;font-weight:700;color:${showLabels ? '#111' : '#111'}">${escapeHtml(playerNames[i] || ('P'+(i+1)))}: ${scores[i]||0}</div>`;
  }
  return html;
}

reshuffleBtn.addEventListener('click', ()=>{
  generateWordMagnets();
  setMessage('New word mix loaded for this round.');
});

// --- PROFILE MANAGER ------------------------------------------------------

function showProfileManager(targetIndex, onClose){
  const modal = document.createElement('div'); modal.className='modal-backdrop';
  const card = document.createElement('div'); card.className='modal-card';
  card.innerHTML = `<div style="font-weight:800;color:#111">Saved Profiles</div><div id="profileList" style="margin-top:12px;max-height:50vh;overflow:auto"></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button id="closeProfiles" class="btn">Close</button></div>`;
  modal.appendChild(card); document.body.appendChild(modal);

  function refresh(){
    const listEl = card.querySelector('#profileList'); listEl.innerHTML = '';
    const list = loadProfiles();
    if(list.length===0){ listEl.innerHTML = '<div style="padding:8px;color:#666">No saved profiles yet.</div>'; return; }
    list.forEach(pr=>{
      const row = document.createElement('div'); 
      row.style.display='flex'; 
      row.style.alignItems='center'; 
      row.style.justifyContent='space-between'; 
      row.style.gap='12px'; 
      row.style.padding='8px 0';

      row.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;background:#eee">
            ${pr.image ? `<img src="${pr.image}" style="width:100%;height:100%;object-fit:cover">` : ''}
          </div>
          <div>
            <div style="font-weight:700;color:#111">${pr.name}</div>
            <div style="font-size:0.85rem;color:#666">${pr.id}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn use" data-id="${pr.id}">Use</button>
          <button class="btn del" data-id="${pr.id}">Delete</button>
        </div>`;

      listEl.appendChild(row);
    });

    listEl.querySelectorAll('button.use').forEach(b=>{
      b.addEventListener('click', (ev)=>{
        const id = ev.target.dataset.id;
        const pr = loadProfiles().find(x=>x.id===id);
        if(pr){
          const nameEl = document.getElementById('name_' + targetIndex);
          const previewEl = document.getElementById('preview_' + targetIndex);
          if(nameEl && previewEl){
            nameEl.value = pr.name;
            uploadedImages[targetIndex] = pr.image || null;
            previewEl.innerHTML = pr.image ? `<img src="${pr.image}" style="width:100%;height:100%;object-fit:cover">` : (targetIndex+1);
            setMessage('Profile applied to player ' + (targetIndex+1) + ': ' + pr.name);
          }
        }
      });
    });

    listEl.querySelectorAll('button.del').forEach(b=>{
      b.addEventListener('click', (ev)=>{
        const id = ev.target.dataset.id;
        deleteProfile(id);
        refresh();
      });
    });
  }

  refresh();
  card.querySelector('#closeProfiles').addEventListener('click', ()=>{ 
    document.body.removeChild(modal); 
    if(onClose) onClose(); 
  });
}

// Finish setup handler
document.addEventListener('click', function finishSetupBinder(e){
  const finishBtn = document.getElementById('finishSetup');
  if(finishBtn && !finishBtn._bound){
    finishBtn._bound = true;
    finishBtn.addEventListener('click', ()=>{
      try{
        for(let p=0;p<chosenPlayers;p++){
          const nameEl = document.getElementById('name_' + p);
          playerNames[p] = nameEl && nameEl.value.trim() ? nameEl.value.trim() : DEFAULT_PLAYER_NAMES[p];
        }
        totalRounds = chosenRounds;
        currentRound = 0;
        scores = loadScores().slice(0,4);
        saveScores(scores);
        updateScoreboard();
        applyTheme(chosenTheme);

        const w = document.getElementById('wizard');
        if(w){ w.style.display = 'none'; w.style.pointerEvents = 'none'; }
        const card = document.getElementById('wizardCard');
        if(card) card.innerHTML = '';

        renderStartButton();
        generateWordMagnets();

        setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 60);

        setMessage('Game ready. Press Start Game to begin round 1.');
      }catch(err){
        console.error('Finish setup failed', err);
        const card = document.getElementById('wizardCard');
        if(card){
          card.innerHTML = '<div style="color:#b00;font-weight:800;padding:18px">Setup failed — check console for details.</div>';
        }
      }
    });
  }
});

// --- INIT -----------------------------------------------------------------

function init(){
  buildBigPool();
  scores = loadScores().slice(0,4);
  updateScoreboard();
  applyTheme(chosenTheme);
  openWizard();
}

window.buildBigPool = buildBigPool;
window.setupBoard = setupBoard;

init();

})();
