<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magnetic Mayhem — Fixed Build</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb347">
<link rel="icon" href="pwa-icons/icon-192.png">

<style>
  *{box-sizing:border-box}
  :root{
    --bg-dark: linear-gradient(180deg,#0a0c0f 0%, #06070a 60%);
    --muted:#bfc4d6;
    --accent:#ffb347;
    --p1:#ff4b6a; --p2:#4da6ff; --p3:#4cd964; --p4:#ffd93b;
    --glass: rgba(255,255,255,0.04);
    --wizard-bg: rgba(250,250,250,0.98);
    --wizard-text: #111;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background: var(--bg-dark);
    color: var(--muted);
    overflow: hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .container{
    width:100%;
    max-width:1800px;
    display:flex;
    flex-direction:column;
    gap:12px;
    height:100vh;
    padding:18px;
    margin:0 auto;
    overflow:auto;
  }

  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-radius:12px;
    background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
    position:sticky;
    top:0;
    z-index:40;
  }

  .title{font-weight:800;color:#fff}
  .subtitle{font-size:0.95rem;color:var(--muted)}
  .controls-inline{display:flex;gap:12px;align-items:center}

  .top-bank{
    padding:12px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
    border:1px solid rgba(255,255,255,0.03);
  }

  .bank-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .bank-controls{display:flex;gap:8px;align-items:center}

  .btn{
    padding:8px 12px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.04);
    color:var(--muted);
    cursor:pointer;
    user-select:none;
  }

  .btn-primary{
    padding:10px 14px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--accent),#ff7b00);
    border:none;
    color:#2b1300;
    font-weight:700;
    cursor:pointer;
  }

  .word-bank{
    position:relative;
    height:320px;
    border-radius:10px;
    margin-top:8px;
    overflow:auto;
    border:1px solid rgba(255,255,255,0.02);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
    padding:8px;
    -webkit-overflow-scrolling: touch;
  }

  .word-magnet{
    position:absolute;
    padding:10px 14px;
    background:#fff;
    color:#111;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    font-weight:800;
    cursor:grab;
    user-select:none;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:1rem;
    touch-action: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  .play-area{
    min-height:720px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
    border:1px solid rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
    padding:12px;
  }

  .player-marker{
    position:absolute;
    width:92px;
    height:92px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    color:#111;
    border:3px solid rgba(255,255,255,0.9);
    box-shadow:0 12px 36px rgba(0,0,0,0.6);
    user-select:none;
    overflow:hidden;
    touch-action: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  .marker-p1{background:var(--p1)}
  .marker-p2{background:var(--p2)}
  .marker-p3{background:var(--p3)}
  .marker-p4{background:var(--p4)}

  .marker-img{ width:78%; height:78%; object-fit:contain; border-radius:50%; display:block; }

  .wizard-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.6);
    z-index:10050;
  }

  .wizard-card{
    width:92%;
    max-width:980px;
    border-radius:14px;
    padding:20px;
    background:var(--wizard-bg);
    color:var(--wizard-text);
    box-shadow:0 20px 60px rgba(0,0,0,0.7);
  }

  .settings-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.6);
    z-index:10100; /* above wizard */
  }

  .settings-card{
    width:92%;
    max-width:820px;
    border-radius:14px;
    padding:18px;
    background: linear-gradient(180deg,#ffffff,#fbfbfd);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    color:#111;
    border: 1px solid rgba(0,0,0,0.04);
  }

  .jounty-row{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .jounty-tile{ min-width:120px; padding:18px 20px; border-radius:14px; background:linear-gradient(180deg,#fff,#f3f3f3); color:#111; font-weight:900; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,0.25); border:1px solid rgba(0,0,0,0.06); transition: transform .12s ease, box-shadow .12s ease; display:flex; align-items:center; justify-content:center; text-align:center; user-select:none; }
  .jounty-tile.selected{ transform: translateY(-6px); box-shadow:0 18px 40px rgba(0,0,0,0.28); background:linear-gradient(180deg,#fff8e6,#fff2d1); }
  .modal-magnet{ display:inline-flex; align-items:center; justify-content:center; padding:6px 10px; margin:4px 6px 4px 0; border-radius:999px; background: linear-gradient(180deg,#fff,#f3f3f3); color:#111; font-weight:800; border:1px solid rgba(0,0,0,0.06); box-shadow: 0 6px 18px rgba(0,0,0,0.12); font-size:0.9rem; }
  .rating-grid{ display:flex; flex-direction:column; gap:14px; }
  .rating-row{ display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
  .pill{ appearance:none; border:1px solid rgba(0,0,0,0.06); background:linear-gradient(180deg,#fff,#f7f7f9); padding:8px 10px; border-radius:999px; margin:0 4px; cursor:pointer; font-weight:800; color:#222; transition: transform .08s ease, box-shadow .08s ease, background .12s ease; }
  .pill.selected{ background: linear-gradient(90deg,#ffd93b,#ffb347); color:#2b1300; }
  .rating-controls{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; min-width:140px; }
  .rating-note{ font-size:0.82rem; color:#666; }
  .score-pill{ display:inline-block; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.06); margin-right:6px; font-weight:700; color:#fff; }

  .timer-display{font-size:0.9rem;color:#fff;}
  .timer-wrap{width:120px;height:6px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;}
  .timer-bar{height:100%;background:linear-gradient(90deg,#4cd964,#ffb347);transition:width 0.2s ease;}

  .controls-row{margin-top:8px;display:flex;justify-content:space-between;align-items:center;}
  .message{font-size:0.9rem;color:var(--muted);}

  .player-highlight{ box-shadow: 0 0 0 4px rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.25); border-radius:12px; }
  .player-highlight.p1{ outline: 4px solid rgba(255,75,106,0.18); }
  .player-highlight.p2{ outline: 4px solid rgba(77,166,255,0.18); }
  .player-highlight.p3{ outline: 4px solid rgba(76,217,100,0.18); }
  .player-highlight.p4{ outline: 4px solid rgba(255,217,59,0.18); }

  body.dragging-touch { overflow: hidden; touch-action: none; }

  /* minimal modal styles (keeps visuals consistent with existing UI) */
  .modal-backdrop{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:10200; }
  .modal-card{ width:92%; max-width:720px; border-radius:12px; padding:18px; background:#fff; color:#111; box-shadow:0 30px 80px rgba(0,0,0,0.45); border:1px solid rgba(0,0,0,0.06); }

  /* clones of magnets inside modal should look like magnets but not be draggable */
  .modal-clone{
    position:relative !important;
    display:inline-flex !important;
    margin:6px !important;
    cursor:default !important;
    pointer-events:none !important;
    transform-origin:center center !important;
  }

  /* small hidden file inputs used for uploads */
  .hidden-file{ display:none; }
</style>
</head>
<body>
<div class="container" id="app">

  <div class="header">
    <div>
      <div class="title">Magnetic Mayhem</div>
      <div class="subtitle">Drag magnets, park your marker, build sentences — then rate the chaos.</div>
    </div>

    <div class="controls-inline">
      <div class="scoreboard" id="scoreboard"></div>
      <div style="width:12px"></div>
      <div class="small" id="themeLabel">Theme: Dark</div>
      <div style="width:12px"></div>
      <button id="openSettings" class="btn" title="Manage profiles & settings">Settings</button>
    </div>
  </div>

  <div class="top-bank">
    <div class="bank-header">
      <div><strong style="color:#fff">Word pool</strong> · Drag magnets into the play area</div>
      <div class="bank-controls">
        <button id="reshuffle" class="btn">New word mix</button>
        <div id="startGameWrap"></div>
        <div style="width:8px"></div>
        <div class="timer-display" id="timerDisplay">Ready</div>
        <div style="width:12px"></div>
        <div class="timer-wrap" title="Time left">
          <div id="timerBar" class="timer-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div id="wordBank" class="word-bank"></div>

    <div class="controls-row">
      <div class="message" id="message">Open "New Game" to configure players, rounds and theme.</div>
    </div>
  </div>

  <div id="playArea" class="play-area">
    <div class="play-hint">Shared play area — park your marker, then drag words near it.</div>
  </div>

</div>

<!-- Wizard overlay (setup) -->
<div id="wizard" class="wizard-overlay" style="display:none">
  <div class="wizard-card" id="wizardCard"></div>
</div>

<!-- Settings overlay (profiles manager) -->
<div id="settings" class="settings-overlay" style="display:none">
  <div class="settings-card" id="settingsCard"></div>
</div>

<script>
(function(){

/* -------------------------
   DOM refs & state
   ------------------------- */
const wordBank = document.getElementById('wordBank');
const playArea = document.getElementById('playArea');
const scoreboardEl = document.getElementById('scoreboard');
const themeLabel = document.getElementById('themeLabel');
const startGameWrap = document.getElementById('startGameWrap');
const timerDisplay = document.getElementById('timerDisplay');
const timerBar = document.getElementById('timerBar');
const messageEl = document.getElementById('message');
const wizard = document.getElementById('wizard');
const wizardCard = document.getElementById('wizardCard');
const settingsOverlay = document.getElementById('settings');
const settingsCard = document.getElementById('settingsCard');
const openSettingsBtn = document.getElementById('openSettings');

const DEFAULT_PLAYER_NAMES = ['Player 1','Player 2','Player 3','Player 4'];

let BIG_POOL = null;
let chosenRounds = 4;
let chosenTime = 90;
let chosenTheme = 'dark';

let wizardStep = 0;
let uploadedImages = [null,null,null,null];
let playerNames = DEFAULT_PLAYER_NAMES.slice();

let markers = [];
let magnets = [];
let magnetId = 1;

let roundActive = false;
let currentRound = 0;
let totalRounds = 0;
let timeLeft = 0;
let timer = null;
let scores = [0,0,0,0];
let chosenPlayers = 2; // default to 2 players for convenience

/* -------------------------
   helpers
   ------------------------- */
function $(sel, root){ return (root || document).querySelector(sel); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function setMessage(text){ if(messageEl) messageEl.textContent = text; }

/* -------------------------
   constants & pools
   ------------------------- */
const PROFILE_KEY = 'mm_profiles_jounty';
const SCORE_KEY = 'mm_scores_jounty';
const POOL_SIZE = 10000;
const ROUND_WORD_COUNT = 200;
const VISIBLE_MAGNETS = 300;

const SENSIBLE_PHRASES = [
  "chicken nugget","starbucks coffee","french toast","cheese grater","coffee shop","train station",
  "post office","phone charger","garden gate","garden shed","movie theater","bus stop","school bus",
  "apple pie","banana bread","chocolate cake","ice cream","paper towel","toilet paper","dinner table",
  "kitchen sink","front door","back yard","living room","bed room","breakfast cereal","lunch box",
  "dinner plate","safety pin","first aid","credit card","bank account","movie night","game night",
  "shopping list","grocery store","coffee mug","water bottle","phone case","car keys","house key",
  "train ticket","flight ticket","hotel room","office chair","desk lamp","reading lamp","study desk","titanic the movie","claudia winkleman","cat litter",
  "georgie","leslie","beverley","allen","house","home","family","boobies","tits","fuck","bollocks","shit","minge","sex","willy","nincompoop","shenanigans","gubbins","pillock","numptey","wazzock"
];

const SEED = ["allen","gray","beverley","leslie","christine","casey","mandy","are","then","moany","I","you","he","she","they","we","it","someone","everyone","nobody","a","an","the","this","that","these","those","my","your","our","their","is","are","was","were","has","have","had","does","do","did","its","it's","isn't","hasn't","needs","need","because","if","but","though","through","and","or","but","if","because","while","when","then","so","cat","dog","dragon","robot","teacher","wizard","pirate","ghost","monster","sandwich","pizza","tea","coffee","cake","sofa","toaster","fridge","banana","run","jump","dance","sing","whisper","shout","laugh","cry","sleep","wash","kneel","drown","cook","bake","brew","make","tiny","huge","sparkly","grumpy","sleepy","noisy","silent","awkward","brilliant","ridiculous","rude","cheeky","horrible","stinky","on","under","over","inside","outside","behind","next","between","around","before","pancake","marshmallow","llama","unicorn","spaceship","cupboard","sock","spoon","noodle","pudding","glitter","chaos","nonsense","mischief","giggle","hiccup","sneeze","burp","rumble","whirlwind","legendary","impossible","unexpected","epic","wonky","secret","plan","accident","story","memory"];

const ING_WORDS = ["running","jumping","dancing","singing","whispering","shouting","laughing","crying","sleeping","eating","building","breaking","spinning","floating","glowing","searching","finding","carrying","holding","pushing","pulling","smiling","frowning","cooking","baking","driving","walking","skipping","painting","drawing","typing","scrolling","listening","talking","breathing","splashing","sneezing","washing","kneeling","drowning","brewing","making","cooked","baked","brewed","ing","ed","er","es","s","ly","end"];
const PUNCTUATION = ['.', ',', '?', '!','.', ',', '?', '!','.', ',', '?', '!'];
const CONNECTORS = ['a','it','was','at','and','s','ed','er','in','of','on','if','when','why','how','a','it','was','at','and','s','ed','er','in','of','on','if','when','why','how'];
const COMMON_WORDS = ['and','the','a','it','is','was','has','have','to','in','on','at','if','s','er','es','the','need','want','could','should','because','why','but','because','when','then','and','the','a','it','is','was','has','have','to','in','on','at','if','but','because','when','then'];

/* -------------------------
   pool builder
   ------------------------- */
function buildBigPool(){
  if(BIG_POOL) return BIG_POOL;
  const adjectives = ["bright","dull","fuzzy","slick","ancient","modern","weird","sudden","quiet","loud","mellow","spicy","bitter","sweet","mystic","rusty","neon","frozen","gentle","brave","calm","wild","sly","bold","soft","sharp","warm","cold","golden","silver","rainbow","colourful","stinky","rude","cheeky"];
  const nouns = ["box","chair","river","mountain","lamp","shoe","hat","phone","keyboard","monitor","bottle","window","door","road","cloud","island","bridge","garden","stone","leaf","star","ship","tower","bench","book","street","market","forest","field","ocean","uncle","aunty","sister","brother","dad","mum","beer","vodka","booze","cat","dog","potato","nipple","frog","hammer","guitar","plant","pot","dressing","gown","pizza","glitter","cheese","pants","jumper","kettle","pills","drugs","music","bath","soap","tree","flower","watch","alexa","bleach","car","bus","train","plane"];
  const verbs = ["run","jump","stink","slice","break","hold","clean","throw","choose","mask","trust","greet","shape","shout","slap","mimic","frown","blow","wear","dance","sing","whisper","!","?",".",",","?","&","?","!","shout","laugh","cry","sleep","eat","build","break","spin","float","glow","search","find","carry","hold","push","pull","wash","kneel","drown","cook","bake","brew","make"];

  const pool = SEED.slice();
  for(let w of ING_WORDS) pool.push(w);
  for(let p of PUNCTUATION) pool.push(p);
  for(let c of CONNECTORS) pool.push(c);

  for(let i=0;i<3000;i++){
    const pick = (i % 3 === 0) ? adjectives[i % adjectives.length] : (i % 3 === 1 ? nouns[i % nouns.length] : verbs[i % verbs.length]);
    pool.push(pick);
  }

  for(let p of SENSIBLE_PHRASES) pool.push(p);

  const EXTRA = ["more","and","it","is","was","has","had","her","she","him","he","they","them","that","this","in","at","of","coz","per","else","than","if","but","because","all","it's","wasn't","isn't","hasn't","to","through","though","were","I"];
  for(let e of EXTRA) pool.push(e);

  let i = 0;
  while(pool.length < POOL_SIZE){
    const pick = (i % 2 === 0) ? nouns[i % nouns.length] : adjectives[i % adjectives.length];
    pool.push(pick);
    i++;
    if(i > 50000) break;
  }

  const uniq = Array.from(new Set(pool)).slice(0, POOL_SIZE);
  shuffle(uniq);
  BIG_POOL = uniq;
  return BIG_POOL;
}

/* -------------------------
   theme
   ------------------------- */
function applyTheme(name){
  chosenTheme = name;
  themeLabel.textContent = 'Theme: ' + ({ dark:'Dark', pastel:'Pastel', rainbow:'Rainbow', xmas:'Christmas', light:'Light' }[name] || name);
  if(name==='pastel'){ document.body.style.background = 'linear-gradient(180deg,#ffe6ff 0%, #fff7f0 60%)'; document.documentElement.style.setProperty('--muted','#6b5b6b'); document.documentElement.style.setProperty('--accent','#ff9ec3'); }
  else if(name==='rainbow'){ document.body.style.background = 'linear-gradient(135deg,#ff4b6a 0%, #ffb347 25%, #ffd93b 50%, #4cd964 75%, #4da6ff 100%)'; document.documentElement.style.setProperty('--muted','#f5f5ff'); document.documentElement.style.setProperty('--accent','#ff4b6a'); }
  else if(name==='xmas'){ document.body.style.background = 'linear-gradient(180deg,#07220f 0%, #0b3b1a 60%)'; document.documentElement.style.setProperty('--muted','#cfe8d8'); document.documentElement.style.setProperty('--accent','#ff4b4b'); }
  else if(name==='light'){ document.body.style.background = 'linear-gradient(180deg,#f6f9fc 0%, #eef6ff 60%)'; document.documentElement.style.setProperty('--muted','#4b6b8b'); document.documentElement.style.setProperty('--accent','#7fb3ff'); }
  else { document.body.style.background = 'linear-gradient(180deg,#0a0c0f 0%, #06070a 60%)'; document.documentElement.style.setProperty('--muted','#bfc4d6'); document.documentElement.style.setProperty('--accent','#ffb347'); }
}

/* -------------------------
   profile storage
   ------------------------- */
function loadProfiles(){ try{ const raw = localStorage.getItem(PROFILE_KEY); if(!raw) return []; return JSON.parse(raw); }catch(e){ return []; } }
function saveProfiles(list){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(list)); }catch(e){} }
function addOrUpdateProfile(pr){ const list = loadProfiles(); const idx = list.findIndex(x=>x.id===pr.id); if(idx>=0) list[idx]=pr; else list.push(pr); saveProfiles(list); }
function deleteProfile(id){ const list = loadProfiles().filter(x=>x.id!==id); saveProfiles(list); }

/* -------------------------
   score storage
   ------------------------- */
function loadScores(){ try{ const raw = localStorage.getItem(SCORE_KEY); if(!raw) return [0,0,0,0]; const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : [0,0,0,0]; }catch(e){ return [0,0,0,0]; } }
function saveScores(arr){ try{ localStorage.setItem(SCORE_KEY, JSON.stringify(arr)); }catch(e){} }

/* -------------------------
   regeneration guard & debug
   ------------------------- */
let _allowMagnetRegeneration = false;
function debugLog(){ /* no-op for production */ }

/* -------------------------
   magnet generation & pool regeneration
   ------------------------- */
function clearBoard(){
  // remove magnet elements
  try{
    magnets.forEach(m=>{
      if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el);
    });
  }catch(e){}
  magnets = [];
  magnetId = 1;
  // clear word bank DOM
  if(wordBank) wordBank.innerHTML = '';
  // clear play area magnets (if any)
  // leave play hint
  const hint = document.createElement('div');
  hint.className = 'play-hint';
  hint.textContent = 'Shared play area — park your marker, then drag words near it.';
  playArea.innerHTML = '';
  playArea.appendChild(hint);
}

function regenerateWordPool(){
  buildBigPool();
  clearBoard();
  const pool = BIG_POOL.slice();
  shuffle(pool);
  const count = Math.min(VISIBLE_MAGNETS, pool.length);
  const bankRect = wordBank.getBoundingClientRect();
  // If bankRect has zero size (not yet laid out), use fallback sizes
  const bankW = bankRect.width || Math.max(600, window.innerWidth * 0.6);
  const bankH = bankRect.height || 320;

  for(let i=0;i<count;i++){
    const text = pool[i];
    const el = document.createElement('div');
    el.className = 'word-magnet';
    el.innerHTML = `<div class="magnet-text">${escapeHtml(text)}</div>`;
    // random position inside bank
    const x = Math.round(rand(8, Math.max(80, bankW - 160)));
    const y = Math.round(rand(6, Math.max(20, bankH - 48)));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.zIndex = 1;
    wordBank.appendChild(el);

    const magnet = { id: magnetId++, text: String(text), el, inPlay:false, x, y, angle:0, scale:1, _absolute:false };
    magnets.push(magnet);
    makeMagnetDraggable(magnet);
  }
}

/* -------------------------
   draggable magnets
   ------------------------- */
function makeMagnetDraggable(magnet){
  const el = magnet.el;
  let dragging = false;
  let offsetX = 0, offsetY = 0;
  let activePointerId = null;
  let activeTouchId = null;
  let hasMoved = false;
  const MOVE_THRESHOLD = 6;

  function startDrag(clientX, clientY, pointerId){
    dragging = true;
    hasMoved = false;
    activePointerId = pointerId ?? null;

    el.style.zIndex = 9999;
    el.classList.add('dragging');
    document.body.classList.add('dragging-touch');

    const r = el.getBoundingClientRect();
    offsetX = clientX - r.left;
    offsetY = clientY - r.top;
  }

  function endDrag(){
    dragging = false;
    activePointerId = null;
    activeTouchId = null;
    hasMoved = false;

    el.style.zIndex = 1;
    el.classList.remove('dragging');
    document.body.classList.remove('dragging-touch');
  }

  /* -------------------------
     POINTER EVENTS
     ------------------------- */
  function onPointerDown(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    startDrag(e.clientX, e.clientY, e.pointerId);
  }

  function onPointerMove(e){
    if(!dragging) return;
    if(activePointerId !== null && e.pointerId !== activePointerId) return;
    e.preventDefault();

    let x = e.clientX - offsetX;
    let y = e.clientY - offsetY;

    if(!hasMoved){
      const rect = el.getBoundingClientRect();
      const dx = Math.abs(e.clientX - (offsetX + rect.left));
      const dy = Math.abs(e.clientY - (offsetY + rect.top));
      if(Math.sqrt(dx*dx + dy*dy) > MOVE_THRESHOLD) hasMoved = true;
    }

    const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
    const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);

    x = clamp(x, 0, vw - el.offsetWidth);
    y = clamp(y, 0, vh - el.offsetHeight);

    if(!magnet._absolute && hasMoved){
      magnet._absolute = true;
      document.body.appendChild(el);
    }

    if(hasMoved){
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      magnet.x = x;
      magnet.y = y;
    }

    const bankRect = wordBank.getBoundingClientRect();
    if(e.clientX >= bankRect.left && e.clientX <= bankRect.right &&
       e.clientY >= bankRect.top && e.clientY <= bankRect.bottom){
      wordBank.classList.add('drag-over');
    } else {
      wordBank.classList.remove('drag-over');
    }
  } // end onPointerMove

  function onPointerUp(e){
    if(activePointerId !== null && e.pointerId !== activePointerId) return;
    try { if(e && e.pointerId != null) el.releasePointerCapture(e.pointerId); } catch(err){}

    if(!hasMoved){
      endDrag();
      return;
    }

    const centerX = magnet.x + el.offsetWidth/2;
    const centerY = magnet.y + el.offsetHeight/2;

    const playRect = playArea.getBoundingClientRect();
    const bankRect = wordBank.getBoundingClientRect();

    if(centerX >= playRect.left && centerX <= playRect.right &&
       centerY >= playRect.top && centerY <= playRect.bottom){

      const localX = centerX - playRect.left - el.offsetWidth/2;
      const localY = centerY - playRect.top - el.offsetHeight/2;

      magnet.inPlay = true;
      magnet.x = clamp(localX, 0, playRect.width - el.offsetWidth);
      magnet.y = clamp(localY, 0, playRect.height - el.offsetHeight);

      playArea.appendChild(el);
      el.style.left = magnet.x + 'px';
      el.style.top = magnet.y + 'px';
      magnet._absolute = false;
      endDrag();
      return;
    }

    if(centerX >= bankRect.left && centerX <= bankRect.right &&
       centerY >= bankRect.top && centerY <= bankRect.bottom){

      const x = Math.round(rand(8, Math.max(80, bankRect.width - 160)));
      const y = Math.round(rand(6, Math.max(20, bankRect.height - 48)));

      magnet.inPlay = false;
      magnet.x = x;
      magnet.y = y;

      wordBank.appendChild(el);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      magnet._absolute = false;
      endDrag();
      return;
    }

    endDrag();
  } // end onPointerUp

  /* -------------------------
     TOUCH EVENTS
     ------------------------- */
  function onTouchStart(ev){
    for(let i=0;i<ev.changedTouches.length;i++){
      const t = ev.changedTouches[i];
      if(t.target === el || el.contains(t.target)){
        ev.preventDefault();
        activeTouchId = t.identifier;
        startDrag(t.clientX, t.clientY, null);
        break;
      }
    }
  }

  function onTouchMove(ev){
    if(!dragging || activeTouchId === null) return;

    let found = null;
    for(let i=0;i<ev.touches.length;i++){
      if(ev.touches[i].identifier === activeTouchId){
        found = ev.touches[i];
        break;
      }
    }
    if(!found) return;
    ev.preventDefault();

    let x = found.clientX - offsetX;
    let y = found.clientY - offsetY;

    if(!hasMoved){
      const rect = el.getBoundingClientRect();
      const dx = Math.abs(found.clientX - (offsetX + rect.left));
      const dy = Math.abs(found.clientY - (offsetY + rect.top));
      if(Math.sqrt(dx*dx + dy*dy) > MOVE_THRESHOLD) hasMoved = true;
    }

    const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
    const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);

    x = clamp(x, 0, vw - el.offsetWidth);
    y = clamp(y, 0, vh - el.offsetHeight);

    if(!magnet._absolute && hasMoved){
      magnet._absolute = true;
      document.body.appendChild(el);
    }

    if(hasMoved){
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      magnet.x = x;
      magnet.y = y;
    }

    const bankRect = wordBank.getBoundingClientRect();
    if(found.clientX >= bankRect.left && found.clientX <= bankRect.right &&
       found.clientY >= bankRect.top && found.clientY <= bankRect.bottom){
      wordBank.classList.add('drag-over');
    } else {
      wordBank.classList.remove('drag-over');
    }
  }

  function onTouchEnd(ev){
    if(!dragging || activeTouchId === null) return;

    for(let i=0;i<ev.changedTouches.length;i++){
      const t = ev.changedTouches[i];
      if(t.identifier === activeTouchId){
        ev.preventDefault();

        if(!hasMoved){
          endDrag();
          return;
        }

        // emulate pointer up
        onPointerUp({ pointerId: null });
        return;
      }
    }
  }

  /* -------------------------
     EVENT LISTENERS
     ------------------------- */
  el.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp, { passive: false });

  el.addEventListener('touchstart', onTouchStart, { passive: false });
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend', onTouchEnd, { passive: false });
  window.addEventListener('touchcancel', onTouchEnd, { passive: false });
} // end makeMagnetDraggable()

/* -----------------------------
    round flow & ratings
   ----------------------------- */
function startRound(){
  if(roundActive) return;
  if(currentRound === 0) setupBoard();
  roundActive = true;
  currentRound++;
  totalRounds = chosenRounds;
  timeLeft = chosenTime;
  timerDisplay.textContent = timeLeft + 's';
  updateTimerBar();
  setMessage(`Round ${currentRound}/${totalRounds} started — ${timeLeft}s`);
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    timeLeft--;
    timerDisplay.textContent = timeLeft + 's';
    updateTimerBar();
    if(timeLeft <= 0){ clearInterval(timer); timer = null; endRound(); }
  },1000);
}

function updateTimerBar(){ const pct = Math.max(0, Math.min(1, timeLeft / chosenTime)); timerBar.style.width = (pct*100) + '%'; if(pct < 0.25) timerBar.style.filter = 'hue-rotate(-20deg) saturate(1.2)'; else timerBar.style.filter = ''; }

function endRound(){
  roundActive = false;
  timerDisplay.textContent = '0s';
  timerBar.style.width = '0%';
  setMessage('Time! Freezing board and computing sentences...');
  magnets.forEach(m=>{ if(m.el) m.el.style.pointerEvents = 'none'; });
  markers.forEach(m=>{ if(m.el) m.el.style.pointerEvents = 'none'; });
  setTimeout(()=>{ openRatingsModal(); }, 200);
}

/* clustering & ratings (unchanged logic) */
function clusterMagnets(eps){
  const threshold = eps || 140;
  const inPlay = magnets.filter(m => m.inPlay && m.el);
  const visited = new Set();
  const clusters = [];
  function centerOf(m){ return { x: m.x + (m.el ? m.el.offsetWidth/2 : 0), y: m.y + (m.el ? m.el.offsetHeight/2 : 0) }; }
  function dist(a,b){ const dx = a.x - b.x; const dy = a.y - b.y; return Math.sqrt(dx*dx + dy*dy); }
  for(let i=0;i<inPlay.length;i++){
    const start = inPlay[i];
    if(visited.has(start)) continue;
    const queue = [start];
    visited.add(start);
    const cluster = [];
    while(queue.length){
      const cur = queue.shift();
      cluster.push(cur);
      const ccur = centerOf(cur);
      for(let j=0;j<inPlay.length;j++){
        const other = inPlay[j];
        if(visited.has(other)) continue;
        const cother = centerOf(other);
        if(dist(ccur, cother) <= threshold){ visited.add(other); queue.push(other); }
      }
    }
    if(cluster.length) clusters.push(cluster);
  }
  return clusters;
}

function assignClustersToMarkers(clusters){
  // If markers are not present, assign clusters round-robin to chosenPlayers
  const assigned = Array.from({length: chosenPlayers}, ()=>[]);
  if(!markers || markers.length === 0){
    clusters.forEach((c, idx)=>{ assigned[idx % chosenPlayers].push(c); });
    return assigned;
  }
  // otherwise use nearest marker logic
  clusters.forEach(cluster=>{
    let cx=0, cy=0;
    cluster.forEach(m=>{ cx += m.x + (m.el ? m.el.offsetWidth/2 : 0); cy += m.y + (m.el ? m.el.offsetHeight/2 : 0); });
    cx /= cluster.length; cy /= cluster.length;
    let bestIdx=0, bestDist=Infinity;
    markers.forEach((mk, idx)=>{ const mx = mk.x + (mk.el ? mk.el.offsetWidth/2 : 0); const my = mk.y + (mk.el ? mk.el.offsetHeight/2 : 0); const dx = mx - cx; const dy = my - cy; const d = Math.sqrt(dx*dx + dy*dy); if(d < bestDist){ bestDist = d; bestIdx = idx; } });
    assigned[bestIdx].push(cluster);
  });
  return assigned;
}

function orderMagnetsRowMajor(cluster){
  if(!cluster || !cluster.length) return [];
  const tolerance = 40;
  const copy = cluster.slice();
  copy.sort((a,b)=>{ const ay=a.y, by=b.y; if(Math.abs(ay-by) > tolerance) return ay - by; return a.x - b.x; });
  return copy;
}

/* -------------------------
   Ratings modal (simplified but functional)
   ------------------------- */
let _lastRoundDeltas = null;

function openRatingsModal(){
  const clusters = clusterMagnets(140);
  if(!clusters.length){
    setMessage('No sentences detected this round. Skipping ratings.');
    // advance without scoring
    showWinnerAndAdvance(null);
    return;
  }

  // assign clusters to players
  const byPlayer = assignClustersToMarkers(clusters);
  const sentencesByPlayer = byPlayer.map(playerClusters=>{
    const out = [];
    playerClusters.forEach(cluster=>{
      const ordered = orderMagnetsRowMajor(cluster);
      const text = ordered.map(m => m.text).join(' ').trim();
      if(text) out.push({magnets: ordered, text});
    });
    return out;
  });

  // Build a simple modal that lists sentences and allows a 1-5 rating per player
  const modal = document.createElement('div'); modal.className='modal-backdrop';
  const card = document.createElement('div'); card.className='modal-card';

  let html = `<div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:900;font-size:1.2rem">Rate the chaos</div>
      <div style="font-size:0.9rem;color:#666">Round ${currentRound}/${totalRounds}</div>
    </div>
    <div style="margin-top:8px;font-size:0.95rem;color:#444">Review each player’s sentences and give them a score for this round.</div>
    <div class="rating-grid" style="margin-top:12px">`;

  for(let p=0;p<chosenPlayers;p++){
    const sentences = sentencesByPlayer[p] || [];
    const name = escapeHtml(playerNames[p] || ('P'+(p+1)));

    html += `<div class="rating-row" data-player="${p}" style="padding:10px;border-radius:10px">`;
    html += `<div style="flex:1;min-width:0">
      <div style="font-weight:800;margin-bottom:6px">${name}</div>`;

    if(sentences.length === 0){
      html += `<div style="font-size:0.85rem;color:#666">No sentences.</div>`;
    } else {
      sentences.forEach((s, si)=>{
        html += `<div class="sentence-row" data-player="${p}" data-sentence="${si}" style="margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center"><div style="margin-right:8px;font-weight:700;color:#222">${escapeHtml(s.text)}</div></div>`;
      });
    }

    html += `</div>`;

    html += `<div class="rating-controls" data-player="${p}">
      <div class="rating-note">Round score</div>
      <div style="display:flex;gap:6px">`;
    for(let score=1;score<=5;score++){
      html += `<button class="pill" data-player="${p}" data-score="${score}">${score}</button>`;
    }
    html += `</div></div></div>`;
  }

  html += `</div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px;gap:10px">
      <button id="ratingsCancel" class="btn">Skip ratings</button>
      <div id="ratingsSubmit" class="jounty-tile">Submit ratings</div>
    </div>`;

  card.innerHTML = html;
  modal.appendChild(card);
  document.body.appendChild(modal);

  // visual highlights
  for(let p=0;p<chosenPlayers;p++){
    const row = card.querySelector(`.rating-row[data-player="${p}"]`);
    if(row){
      row.classList.add('player-highlight');
      row.classList.add('p' + (p+1));
    }
  }

  // pill selection behavior
  card.querySelectorAll('.pill').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const p = btn.dataset.player;
      // deselect other pills for this player
      card.querySelectorAll(`.pill[data-player="${p}"]`).forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  const cancelBtn = card.querySelector('#ratingsCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
    showWinnerAndAdvance(null);
  });

  const submitBtn = card.querySelector('#ratingsSubmit');
  if(submitBtn) submitBtn.addEventListener('click', ()=>{
    // collect ratings
    const deltas = Array.from({length: chosenPlayers}, ()=>0);
    for(let p=0;p<chosenPlayers;p++){
      const sel = card.querySelector(`.pill.selected[data-player="${p}"]`);
      const val = sel ? parseInt(sel.dataset.score,10) : 0;
      deltas[p] = val;
    }

    // apply deltas to scores
    for(let i=0;i<chosenPlayers;i++){
      scores[i] = (scores[i] || 0) + (deltas[i] || 0);
    }

    // determine top indexes for winner display (based on this round's deltas)
    let max = -Infinity;
    for(let i=0;i<chosenPlayers;i++) if(deltas[i] > max) max = deltas[i];
    const topIndexes = [];
    for(let i=0;i<chosenPlayers;i++){
      if(deltas[i] === max && max > 0) topIndexes.push(i);
    }

    saveScores(scores);
    updateScoreboard();

    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);

    _lastRoundDeltas = deltas.slice();

    if(topIndexes.length > 1){
      showWinnerAndAdvance(topIndexes);
    } else if(topIndexes.length === 1){
      showWinnerAndAdvance(topIndexes[0]);
    } else {
      showWinnerAndAdvance(null);
    }
  });
}

/* -------------------------
   winner modal & round advance
   ------------------------- */
function showWinnerAndAdvance(winnerData){
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  const card = document.createElement('div');
  card.className = 'modal-card';

  let title = 'Round results';
  let body = '';

  if(winnerData == null){
    body += `<div style="font-size:1rem">No clear winner this round.</div>`;
  } else {
    const winners = Array.isArray(winnerData) ? winnerData : [winnerData];
    const idx = winners[0];
    const wName = escapeHtml(playerNames[idx] || ('P'+(idx+1)));
    body += `<div style="margin-top:8px;font-size:1rem">${wName} won that round</div>`;
  }

  const isLastRound = currentRound >= totalRounds;

  body += `<div style="margin-top:14px;font-size:0.9rem;color:#555">${isLastRound ? 'That was the final round.' : 'Get ready for the next round.'}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px;gap:8px">
      ${isLastRound ? '<div id="roundFinalScores" class="jounty-tile">View final scores</div>' : '<div id="roundNext" class="jounty-tile">Next round</div>'}
      <button id="roundClose" class="btn">Close</button>
    </div>`;

  card.innerHTML = `<div style="font-weight:900;font-size:1.2rem">${title}</div>${body}`;
  modal.appendChild(card);
  document.body.appendChild(modal);

  // highlight winner(s) visually on the modal
  if(winnerData != null){
    const winners = Array.isArray(winnerData) ? winnerData : [winnerData];
    winners.forEach(wi=>{
      const tile = document.createElement('div');
      tile.className = 'jounty-tile player-highlight p' + (wi+1);
      tile.style.marginTop = '12px';
      tile.style.display = 'inline-block';
      tile.textContent = (playerNames[wi] || ('P'+(wi+1))) + ' — +' + ((_lastRoundDeltas && _lastRoundDeltas[wi]) || 0);
      card.appendChild(tile);
    });
  }

  const closeModal = ()=>{ if(modal && modal.parentNode) modal.parentNode.removeChild(modal); };

  const nextBtn = card.querySelector('#roundNext');
  const finalBtn = card.querySelector('#roundFinalScores');
  const closeBtn = card.querySelector('#roundClose');

  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      closeModal();
      resetForNextRound();
    });
  }
  if(finalBtn){
    finalBtn.addEventListener('click', ()=>{
      closeModal();
      showFinalResults();
    });
  }
  if(closeBtn){
    closeBtn.addEventListener('click', ()=>{
      closeModal();
      if(!isLastRound) resetForNextRound(); else showFinalResults();
    });
  }

  function onKey(e){
    if(e.key==='Escape'){
      closeModal();
      window.removeEventListener('keydown', onKey);
      if(!isLastRound) resetForNextRound(); else showFinalResults();
    }
  }
  window.addEventListener('keydown', onKey);
}

function resetForNextRound(){
  roundActive = false;

  magnets.forEach(m=>{ if(m.el) m.el.style.pointerEvents = 'auto'; });
  markers.forEach(m=>{ if(m.el) m.el.style.pointerEvents = 'auto'; });

  if(currentRound < totalRounds){
    regenerateWordPool();
    timeLeft = chosenTime;
    timerDisplay.textContent = 'Ready';
    timerBar.style.width = '0%';
    timerBar.style.filter = '';
    renderStartButton();
    setMessage(`Round ${currentRound+1}/${totalRounds} — press Start Game when ready.`);
  } else {
    setMessage('All rounds complete. View final scores.');
    showFinalResults();
  }
}

function showFinalResults(){
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  const card = document.createElement('div');
  card.className = 'modal-card';

  card.innerHTML = `<div style="font-weight:900;font-size:1.2rem">Game Over — Final Scores</div>
    <div style="margin-top:12px">${renderScoreboardInline(true)}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px;gap:8px">
      <div id="finalRestart" class="jounty-tile">New Game</div>
      <div id="finalClose" class="btn">Close</div>
    </div>`;

  modal.appendChild(card);
  document.body.appendChild(modal);

  function doFullReset(){
    try{
      document.querySelectorAll('.modal-backdrop').forEach(n=>{
        if(n && n.parentNode) n.parentNode.removeChild(n);
      });
    }catch(e){}

    // Reset scores to zero for a fresh new game
    scores = [0,0,0,0];
    saveScores(scores);
    updateScoreboard();

    currentRound = 0;
    totalRounds = chosenRounds;

    clearBoard();
    renderStartButton();

    setMessage('Game reset. Opening setup wizard...');
    setTimeout(()=>{ openWizard(); }, 80);
  }

  const restartBtn = card.querySelector('#finalRestart');
  if(restartBtn) restartBtn.addEventListener('click',(ev)=>{
    ev.preventDefault();
    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
    doFullReset();
  });

  const closeBtn = card.querySelector('#finalClose');
  if(closeBtn) closeBtn.addEventListener('click',(ev)=>{
    ev.preventDefault();
    if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
    setMessage('Final scores shown. Press New Game to start again.');
  });

  function onKey(e){
    if(e.key==='Escape'){
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      window.removeEventListener('keydown', onKey);
    }
  }
  window.addEventListener('keydown', onKey);
}

/* -------------------------
   scoreboard helpers
   ------------------------- */
function updateScoreboard(){
  scoreboardEl.innerHTML = '';
  for(let i=0;i<chosenPlayers;i++){
    const pill = document.createElement('div');
    pill.className = 'score-pill';
    pill.textContent = `${playerNames[i] || ('P'+(i+1))}: ${scores[i] || 0}`;
    scoreboardEl.appendChild(pill);
  }
}
function renderScoreboardInline(showLabels){
  let html = '';
  for(let i=0;i<chosenPlayers;i++){
    html += `<div style="display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,0.04);margin-right:6px;font-weight:700;color:${showLabels ? '#111' : '#111'}">${escapeHtml(playerNames[i] || ('P'+(i+1)))}: ${scores[i]||0}</div>`;
  }
  return html;
}

/* -------------------------
   settings (profiles) UI
   ------------------------- */
function openSettings(){
  settingsCard.innerHTML = `<div style="font-weight:800;color:#111">Saved Profiles</div><div id="profileList" style="margin-top:12px;max-height:50vh;overflow:auto"></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button id="closeSettings" class="btn">Close</button></div>`;

function refreshSettingsList(){
  const listEl = settingsCard.querySelector('#profileList'); if(!listEl) return;
  listEl.innerHTML = '';
  const list = loadProfiles();
  if(list.length===0){ listEl.innerHTML = '<div style="padding:8px;color:#666">No saved profiles yet.</div>'; return; }
  list.forEach(pr=>{
    const row = document.createElement('div');
    row.style.display='flex'; row.style.alignItems='center'; row.style.justifyContent='space-between'; row.style.gap='12px'; row.style.padding='8px 0';
    row.innerHTML = `<div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;border-radius:50%;overflow:hidden;background:#eee">${pr.image ? `<img src="${pr.image}" style="width:100%;height:100%;object-fit:cover">` : ''}</div><div><div style="font-weight:700;color:#111">${pr.name}</div><div style="font-size:0.85rem;color:#666">${pr.id}</div></div></div><div style="display:flex;gap:8px"><button class="btn use" data-id="${pr.id}">Use</button><button class="btn edit" data-id="${pr.id}">Edit</button><button class="btn changeimg" data-id="${pr.id}">Change image</button><button class="btn del" data-id="${pr.id}">Delete</button></div>`;
    listEl.appendChild(row);
  });

  // attach handlers
  listEl.querySelectorAll('button.use').forEach(b=>{
    b.addEventListener('click', (ev)=>{
      const id = ev.target.dataset.id;
      const pr = loadProfiles().find(x=>x.id===id);
      if(pr){
        let target = 0;
        if(wizard.style.display === 'flex'){
          for(let i=0;i<chosenPlayers;i++){
            const nameEl = document.getElementById('name_' + i);
            if(nameEl && (!nameEl.value || nameEl.value.trim() === '')){ target = i; break; }
          }
        }
        const nameEl = document.getElementById('name_' + target);
        const previewEl = document.getElementById('preview_' + target);
        if(nameEl && previewEl){
          nameEl.value = pr.name;
          uploadedImages[target] = pr.image || null;
          previewEl.innerHTML = pr.image ? `<img src="${pr.image}" style="width:100%;height:100%;object-fit:cover">` : (target+1);
          setMessage('Profile applied to player ' + (target+1) + ': ' + pr.name);
        }
      }
    });
  });

  listEl.querySelectorAll('button.del').forEach(b=>{
    b.addEventListener('click', (ev)=>{
      const id = ev.target.dataset.id;
      deleteProfile(id);
      refreshSettingsList();
    });
  });

  listEl.querySelectorAll('button.edit').forEach(b=>{
    b.addEventListener('click', (ev)=>{
      const id = ev.target.dataset.id;
      const pr = loadProfiles().find(x=>x.id===id);
      if(!pr) return;
      const newName = prompt('Edit name for profile', pr.name);
      if(newName && newName.trim()){
        pr.name = newName.trim();
        addOrUpdateProfile(pr);
        refreshSettingsList();
      }
    });
  });

  // change image handler: create a hidden file input, trigger it, read file and update profile
  listEl.querySelectorAll('button.changeimg').forEach(b=>{
    b.addEventListener('click', (ev)=>{
      const id = ev.target.dataset.id;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.className = 'hidden-file';
      input.addEventListener('change', (e)=>{
        const f = e.target.files && e.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = function(evt){
          const data = evt.target.result;
          const pr = loadProfiles().find(x=>x.id===id);
          if(pr){
            pr.image = data;
            addOrUpdateProfile(pr);
            refreshSettingsList();
            setMessage('Profile image updated for ' + pr.name);
          }
        };
        reader.readAsDataURL(f);
      });
      document.body.appendChild(input);
      input.click();
      // cleanup after selection
      input.addEventListener('blur', ()=>{ setTimeout(()=>{ if(input && input.parentNode) input.parentNode.removeChild(input); }, 200); });
    });
  });
}

/* -------------------------
   wizard (setup) UI
   ------------------------- */
function openWizard(){
  try{ document.querySelectorAll('.modal-backdrop').forEach(n=>{ if(n && n.parentNode) n.parentNode.removeChild(n); }); }catch(e){}
  wizard.style.display = 'flex';
  wizard.style.pointerEvents = 'auto';
  wizard.style.zIndex = '10050';
  wizardStep = 0;
  uploadedImages = [null,null,null,null];
  wizardCard.innerHTML = '';
  renderWizard();
}

function refreshWizardProfileSelects(){
  const savedProfiles = loadProfiles();
  for(let i=0;i<chosenPlayers;i++){
    const sel = document.getElementById('profile_select_' + i);
    if(!sel) continue;
    const prevVal = sel.value;
    sel.innerHTML = '<option value="">(none)</option>' + savedProfiles.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    sel.value = prevVal || '';
  }
}

function renderWizard(){
  wizardCard.innerHTML = '';
  if(wizardStep === 0){
    wizardCard.innerHTML = `<div style="text-align:center"><div style="font-size:1.6rem;font-weight:900;color:#111">Magnetic Mayhem</div><div class="small" style="color:#444;margin-top:6px">Choose players, rounds, time and theme — then begin.</div><div class="jounty-row" style="margin-top:18px"><div id="startNew" class="jounty-tile">New Game</div></div></div>`;
    $('#startNew', wizardCard).addEventListener('click', ()=>{ wizardStep=1; renderWizard(); });
    return;
  }

  if(wizardStep === 1){
    wizardCard.innerHTML = `<div style="text-align:center"><div style="font-size:1.2rem;font-weight:800;color:#111">Players</div><div class="small" style="color:#333;margin-top:6px">Select how many players will play</div><div class="jounty-row" id="playerRow"></div><div style="margin-top:12px"><div id="toTime" class="jounty-tile">Next</div></div></div>`;
    const row = $('#playerRow', wizardCard);
    [1,2,3,4].forEach(n=>{
      const el = document.createElement('div');
      el.className='jounty-tile';
      el.textContent = n + (n>1 ? ' Players' : ' Player');
      el.dataset.val = n;
      if(n === chosenPlayers) el.classList.add('selected');
      el.addEventListener('click', ()=>{
        chosenPlayers = n;
        Array.from(row.children).forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
      row.appendChild(el);
    });
    $('#toTime', wizardCard).addEventListener('click', ()=>{ wizardStep=2; renderWizard(); });
    return;
  }

  if(wizardStep === 2){
    wizardCard.innerHTML = `<div style="text-align:center"><div style="font-size:1.2rem;font-weight:800;color:#111">Rounds & Time</div><div class="small" style="color:#333;margin-top:6px">Choose number of rounds and round length</div><div style="display:flex;gap:18px;justify-content:center;margin-top:12px"><div><div style="font-weight:800;color:#111;margin-bottom:8px">Rounds</div><div class="jounty-row" id="roundRow"></div></div><div><div style="font-weight:800;color:#111;margin-bottom:8px">Time</div><div class="jounty-row" id="timeRow"></div></div></div><div class="wizard-actions" style="margin-top:14px"><div id="toTheme" class="jounty-tile">Next</div><div id="backToPlayers" class="jounty-tile">Back</div></div></div>`;
    const roundRow = $('#roundRow', wizardCard);
    [2,4,5,10].forEach(r=>{
      const el = document.createElement('div');
      el.className='jounty-tile';
      el.textContent = r + ' Rounds';
      el.dataset.val = r;
      if(r === chosenRounds) el.classList.add('selected');
      el.addEventListener('click', ()=>{ chosenRounds = r; Array.from(roundRow.children).forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); });
      roundRow.appendChild(el);
    });
    const timeRow = $('#timeRow', wizardCard);
    [60,90,120].forEach(t=>{
      const el = document.createElement('div');
      el.className='jounty-tile';
      el.textContent = t + 's';
      el.dataset.val = t;
      if(t === chosenTime) el.classList.add('selected');
      el.addEventListener('click', ()=>{ chosenTime = t; Array.from(timeRow.children).forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); });
      timeRow.appendChild(el);
    });
    $('#toTheme', wizardCard).addEventListener('click', ()=>{ wizardStep=3; renderWizard(); });
    $('#backToPlayers', wizardCard).addEventListener('click', ()=>{ wizardStep=1; renderWizard(); });
    return;
  }

  if(wizardStep === 3){
    wizardCard.innerHTML = `<div style="text-align:center"><div style="font-size:1.2rem;font-weight:800;color:#111">Theme & Profiles</div><div class="small" style="color:#333;margin-top:6px">Pick a theme and choose saved profiles</div><div class="jounty-row" id="themeRow" style="margin-top:12px"></div><div id="playerSlots" style="margin-top:12px"></div><div style="margin-top:12px"><div id="finishSetup" class="jounty-tile">Finish Setup</div><div id="backToRounds" class="jounty-tile">Back</div></div></div>`;

    const themeRow = $('#themeRow', wizardCard);
    ['dark','pastel','rainbow','xmas','light'].forEach(t=>{
      const el = document.createElement('div');
      el.className='jounty-tile';
      el.textContent = t.charAt(0).toUpperCase() + t.slice(1);
      if(t === chosenTheme) el.classList.add('selected');
      el.addEventListener('click', ()=>{ chosenTheme = t; Array.from(themeRow.children).forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); });
      themeRow.appendChild(el);
    });

    const slots = $('#playerSlots', wizardCard);
    slots.innerHTML = '';
    const savedProfiles = loadProfiles();
    for(let i=0;i<chosenPlayers;i++){
      const row = document.createElement('div');
      row.style.display='flex';
      row.style.alignItems='center';
      row.style.gap='12px';
      row.style.marginTop='8px';

      const profileOptions = ['(none)'].concat(savedProfiles.map(p=>p.id));
      const selectHtml = `<select id="profile_select_${i}" style="padding:8px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);max-width:160px"><option value="">(none)</option>` + savedProfiles.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('') + `</select>`;

      // add a small file input for uploading a profile image for this slot
      const fileInputId = 'upload_input_' + i;
      const fileInputHtml = `<input id="${fileInputId}" class="hidden-file" type="file" accept="image/*">`;

      row.innerHTML = `
        <div id="preview_${i}" style="width:56px;height:56px;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center">
          ${uploadedImages[i] ? '<img src="'+uploadedImages[i]+'" style="width:100%;height:100%;object-fit:cover">' : (i+1)}
        </div>
        <input id="name_${i}" placeholder="Player ${i+1} name" value="${escapeHtml(playerNames[i]||DEFAULT_PLAYER_NAMES[i])}" style="padding:8px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);min-width:220px">
        ${selectHtml}
        <button type="button" class="btn" id="saveProfile_${i}">Save profile</button>
        <button type="button" class="btn" id="uploadBtn_${i}">Upload image</button>
        ${fileInputHtml}
      `;
      slots.appendChild(row);
    }

    // wire up profile selects, save buttons and upload buttons
    for(let i=0;i<chosenPlayers;i++){
      const sel = document.getElementById('profile_select_' + i);
      if(sel){
        sel.addEventListener('change', (ev)=>{
          const id = ev.target.value;
          if(!id){
            uploadedImages[i] = null;
            const prev = document.getElementById('preview_' + i);
            if(prev) prev.innerHTML = (i+1);
            return;
          }
          const pr = loadProfiles().find(x=>x.id===id);
          if(pr){
            uploadedImages[i] = pr.image || null;
            const prev = document.getElementById('preview_' + i);
            if(prev) prev.innerHTML = pr.image ? `<img src="${pr.image}" style="width:100%;height:100%;object-fit:cover">` : (i+1);
            const nameEl = document.getElementById('name_' + i);
            if(nameEl) nameEl.value = pr.name;
            setMessage('Loaded profile into slot ' + (i+1) + ': ' + pr.name);
          }
        });
      }

      const saveBtn = document.getElementById('saveProfile_' + i);
      if(saveBtn){
        saveBtn.addEventListener('click', ()=>{
          const nameEl = document.getElementById('name_' + i);
          const name = nameEl && nameEl.value.trim() ? nameEl.value.trim() : DEFAULT_PLAYER_NAMES[i];
          const id = name.toLowerCase().replace(/\s+/g,'_') || ('player_'+i);
          addOrUpdateProfile({ id, name, image: uploadedImages[i] || null });
          setMessage('Profile saved: ' + name);
          // refresh selects to include new profile without re-rendering the wizard
          refreshWizardProfileSelects();
        });
      }

      // upload button triggers hidden file input
      const uploadBtn = document.getElementById('uploadBtn_' + i);
      const fileInput = document.getElementById('upload_input_' + i);
      if(uploadBtn && fileInput){
        uploadBtn.addEventListener('click', ()=>{
          fileInput.value = '';
          fileInput.click();
        });
        fileInput.addEventListener('change', (ev)=>{
          const f = ev.target.files && ev.target.files[0];
          if(!f) return;
          const reader = new FileReader();
          reader.onload = function(evt){
            const data = evt.target.result;
            uploadedImages[i] = data;
            const prev = document.getElementById('preview_' + i);
            if(prev) prev.innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
            setMessage('Image uploaded for player slot ' + (i+1));
          };
          reader.readAsDataURL(f);
        });
      }
    }

    $('#backToRounds', wizardCard).addEventListener('click', ()=>{ wizardStep=2; renderWizard(); });

    const finishBtn = document.getElementById('finishSetup');
    if(finishBtn && !finishBtn._bound){
      finishBtn._bound = true;
      finishBtn.addEventListener('click', ()=>{
        try{
          for(let p=0;p<chosenPlayers;p++){
            const nameEl = document.getElementById('name_' + p);
            playerNames[p] = nameEl && nameEl.value.trim() ? nameEl.value.trim() : DEFAULT_PLAYER_NAMES[p];
          }
          totalRounds = chosenRounds;
          currentRound = 0;
          // Reset scores to zero for a new game (user requested)
          scores = [0,0,0,0];
          saveScores(scores);
          updateScoreboard();
          applyTheme(chosenTheme);

          wizard.style.display = 'none';
          wizardCard.innerHTML = '';

          renderStartButton();
          regenerateWordPool();

          setMessage('Game ready. Press Start Game to begin round 1.');
        }catch(err){
          console.error('Finish setup failed', err);
          const card = document.getElementById('wizardCard');
          if(card) card.innerHTML = '<div style="color:#b00;font-weight:800;padding:18px">Setup failed — check console for details.</div>';
        }
      });
    }
    return;
  }
}

/* -------------------------
   UI helpers
   ------------------------- */
function renderStartButton(){
  startGameWrap.innerHTML = '';
  const btn = document.createElement('div');
  btn.className = 'jounty-tile';
  btn.style.minWidth = '140px';
  btn.textContent = roundActive ? 'Round in progress' : 'Start Game';
  btn.addEventListener('click', ()=>{
    if(roundActive) return;
    startRound();
  });
  startGameWrap.appendChild(btn);
}

/* -------------------------
   event wiring (one-time)
   ------------------------- */
document.getElementById('reshuffle').addEventListener('click', ()=>{
  regenerateWordPool();
  setMessage('New word mix loaded for this round.');
});

openSettingsBtn.addEventListener('click', ()=>{ openSettings(); });

/* -------------------------
   init
   ------------------------- */
function init(){
  buildBigPool();
  scores = loadScores().slice(0,4);
  updateScoreboard();
  applyTheme(chosenTheme);
  renderStartButton();
  openWizard();
}

window.buildBigPool = buildBigPool;
function setupBoard(){
  // Placeholder to satisfy the call in startRound().
  // Board setup is handled by regenerateWordPool and user interactions.
}
window.setupBoard = setupBoard;

init();

/* -------------------------
   service worker (keep)
   ------------------------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(err => console.log('SW registration failed', err));
}

})(); /* IIFE end */
</script>
