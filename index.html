<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magnetic Mayhem — Ratings & Profiles Fix</title>

<style>
  *{box-sizing:border-box}
  :root{
    --bg-dark: linear-gradient(180deg,#0a0c0f 0%, #06070a 60%);
    --muted:#bfc4d6;
    --accent:#ffb347;
    --p1:#ff4b6a; --p2:#4da6ff; --p3:#4cd964; --p4:#ffd93b;
    --glass: rgba(255,255,255,0.04);
    --wizard-bg: rgba(250,250,250,0.98);
    --wizard-text: #111;
  }

  html,body{height:100%;margin:0;padding:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg-dark);color:var(--muted);overflow:hidden}
  .container{width:100%;max-width:1800px;margin:0 auto;padding:18px;height:100vh;display:flex;flex-direction:column;gap:12px;overflow:auto}
  .header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 8px 30px rgba(0,0,0,0.6);position:sticky;top:0;z-index:40}
  .title{font-weight:800;color:#fff}
  .subtitle{font-size:0.95rem;color:var(--muted)}
  .controls-inline{display:flex;gap:12px;align-items:center}
  .btn{padding:8px 12px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:var(--muted);cursor:pointer}
  .btn-primary{padding:10px 14px;border-radius:999px;background:linear-gradient(90deg,var(--accent),#ff7b00);border:none;color:#2b1300;font-weight:700;cursor:pointer}
  .top-bank{padding:12px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));border:1px solid rgba(255,255,255,0.03)}
  .word-bank{position:relative;height:320px;border-radius:10px;margin-top:8px;overflow:auto;border:1px solid rgba(255,255,255,0.02);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));padding:8px}
  .word-magnet{position:absolute;padding:10px 14px;background:#fff;color:#111;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.45);font-weight:800;cursor:grab;touch-action:none;user-select:none;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:1rem;transition:transform 160ms}
  .word-magnet.jaunty{transform-origin:center;transition:transform 220ms cubic-bezier(.2,.9,.2,1)}
  .play-area{min-height:520px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));border:1px solid rgba(255,255,255,0.03);position:relative;overflow:hidden;padding:12px}
  .play-hint{position:absolute;left:16px;top:12px;color:var(--muted);font-size:0.95rem;z-index:2}
  .player-marker{position:absolute;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#111;border:3px solid rgba(255,255,255,0.9);box-shadow:0 12px 36px rgba(0,0,0,0.6);user-select:none;touch-action:none;overflow:hidden;font-size:0.95rem}
  .marker-p1{background:var(--p1)}.marker-p2{background:var(--p2)}.marker-p3{background:var(--p3)}.marker-p4{background:var(--p4)}
  .marker-img{width:100%;height:100%;object-fit:cover;display:block}
  .timer-display{font-weight:800;color:var(--muted);padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.02)}
  .timer-wrap{width:320px;height:14px;background:rgba(255,255,255,0.06);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.04)}
  .timer-bar{height:100%;background:linear-gradient(90deg,var(--accent),#ff7b00);width:0%;transition:width 0.2s linear}
  .message{color:var(--muted);font-size:0.95rem}
  .inline-wizard{width:100%;max-width:980px;border-radius:12px;padding:16px;background:var(--wizard-bg);color:var(--wizard-text);box-shadow:0 20px 60px rgba(0,0,0,0.5);margin:12px auto}
  .jounty-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .jounty-tile{min-width:120px;padding:18px 20px;border-radius:14px;background:linear-gradient(180deg,#fff,#f3f3f3);color:#111;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.25)}
  .jounty-tile.selected{background:linear-gradient(90deg,var(--accent),#ff7b00);color:#2b1300}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10010}
  .modal-card{width:92%;max-width:760px;border-radius:14px;padding:18px;background:linear-gradient(180deg,#fff,#f7f7f7);box-shadow:0 30px 80px rgba(0,0,0,0.6);color:#111}
  .modal-magnet{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;margin:4px;border-radius:10px;background:#fff;color:#111;font-weight:800;border:1px solid rgba(0,0,0,0.06);box-shadow:0 8px 20px rgba(0,0,0,0.25);font-size:0.9rem}
  .pill{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,0.04);color:#333;border:1px solid rgba(0,0,0,0.06);cursor:pointer}
  .pill.selected{background:linear-gradient(90deg,var(--accent),#ff7b00);color:#2b1300;border:none}
  .scoreboard{display:flex;gap:12px;align-items:center}
  .score-pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.03);color:var(--muted);font-weight:700;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
  input[type="file"]{display:inline-block}
  .profile-row{display:flex;gap:12px;align-items:center;margin-top:8px}
  .confirm{color:#0a8a0a;font-weight:700;margin-left:8px}
  @media (max-width:900px){.word-bank{height:180px}.play-area{min-height:420px}.player-marker{width:72px;height:72px}.timer-wrap{width:200px}}
</style>
</head>
<body>
<div class="container" id="app">

  <div class="header">
    <div>
      <div class="title">Magnetic Mayhem</div>
      <div class="subtitle">Drag magnets, park your marker, build sentences — then rate the chaos.</div>
    </div>

    <div class="controls-inline">
      <div class="scoreboard" id="scoreboard"></div>
      <div style="width:12px"></div>
      <div class="small" id="themeLabel">Theme: Dark</div>
      <div style="width:12px"></div>
      <button id="openNewGame" class="btn-primary" title="New Game">New Game</button>
    </div>
  </div>

  <div id="inlineWizard" class="inline-wizard" style="display:none"></div>

  <div class="top-bank">
    <div class="bank-header">
      <div><strong style="color:#fff">Word pool</strong> · Drag magnets into the play area</div>
      <div class="bank-controls">
        <button id="reshuffle" class="btn">New word mix</button>
        <div id="startGameWrap"></div>
        <div style="width:8px"></div>
        <div class="timer-display" id="timerDisplay">Ready</div>
        <div style="width:12px"></div>
        <div class="timer-wrap" title="Time left">
          <div id="timerBar" class="timer-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div id="wordBank" class="word-bank" aria-label="Word magnets area"></div>

    <div class="controls-row">
      <div class="message" id="message">Press New Game to configure players, rounds and theme.</div>
    </div>
  </div>

  <div id="playArea" class="play-area" aria-label="Play area">
    <div class="play-hint">Shared play area — park your marker, then drag words near it.</div>
  </div>

</div>
<script>
(function(){

  const PROFILE_KEY = 'mm_profiles_jounty';
  const SCORE_KEY = 'mm_scores_jounty';
  const POOL_SIZE = 10000;
  const ROUND_WORD_COUNT = 200;
  const VISIBLE_MAGNETS = 300;

  const COMMON_WORDS = ['and','it','was','s','a','an','the','to','of','in','on','at','by','with','her','him','she','he','they','them','we','you','I','this','that','is','are','be','been','has','have','georgie','leslie','beverley','allen','house','home','family'];

  const DEFAULT_PLAYER_NAMES = ['Player 1','Player 2','Player 3','Player 4'];

  const inlineWizard = document.getElementById('inlineWizard');
  const wordBank = document.getElementById('wordBank');
  const playArea = document.getElementById('playArea');
  const reshuffleBtn = document.getElementById('reshuffle');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerBar = document.getElementById('timerBar');
  const messageEl = document.getElementById('message');
  const startGameWrap = document.getElementById('startGameWrap');
  const scoreboardEl = document.getElementById('scoreboard');
  const themeLabel = document.getElementById('themeLabel');
  const openNewGameBtn = document.getElementById('openNewGame');
  let BIG_POOL = null;
  let magnets = [];
  let markers = [];
  let magnetId = 1;

  let chosenPlayers = 3;
  let chosenTime = 60;
  let chosenRounds = 2;
  let chosenTheme = 'dark';

  let uploadedImages = [null,null,null,null];
  let playerNames = DEFAULT_PLAYER_NAMES.slice();

  let roundActive = false;
  let timer = null;
  let timeLeft = 60;
  let currentRound = 0;
  let totalRounds = 2;
  let scores = [0,0,0,0];

  function $(s,ctx=document){return ctx.querySelector(s)}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function rand(min,max){return Math.random()*(max-min)+min}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
  function setMessage(t){ messageEl.textContent = t }
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function loadProfiles(){ try{ const raw = localStorage.getItem(PROFILE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } }
  function saveProfiles(list){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(list)); }catch(e){} }
  function deleteProfile(id){ const list = loadProfiles().filter(p=>p.id!==id); saveProfiles(list); }

  function loadScores(){ try{ const raw = localStorage.getItem(SCORE_KEY); return raw ? JSON.parse(raw) : [0,0,0,0]; }catch(e){ return [0,0,0,0]; } }
  function saveScores(arr){ try{ localStorage.setItem(SCORE_KEY, JSON.stringify(arr)); }catch(e){} }

  const SEED = ['allen','beverley','leslie','georgie','I','you','he','she','they','we','it','a','the','is','are','run','jump','dance','pizza','coffee','home','house','family','chaos','nonsense','mischief','garden','door','window','lamp','book','star','river','mountain','island','train','ticket','hotel','room'];

  function buildBigPool(){
    if(BIG_POOL) return BIG_POOL;
    const pool = SEED.slice();
    const adjectives = ["bright","fuzzy","ancient","modern","weird","quiet","loud","mellow","spicy","sweet","mystic","rusty","neon","frozen","gentle","brave"];
    const nouns = [
      "box","chair","river","mountain","lamp","shoe","hat","phone","keyboard","monitor",
      "bottle","window","door","road","cloud","island","bridge","garden","stone","leaf",
      "star","ship","tower","bench","book","street","market","forest","field","ocean"
    ];

    const verbs = [
      "run","jump","dance","sing","whisper","shout","laugh","cry","sleep","eat",
      "build","break","spin","float","glow","search","find","carry","hold","push","pull"
    ];

    // Expand pool with combinations
    for (let i = 0; i < 3000; i++) {
      pool.push(adjectives[i % adjectives.length]);
      pool.push(nouns[i % nouns.length]);
      pool.push(verbs[i % verbs.length]);
    }

    // Add common words again for weighting
    for (let p of COMMON_WORDS) {
      pool.push(p);
    }

    shuffle(pool);

    // Deduplicate and trim to POOL_SIZE
    BIG_POOL = Array.from(new Set(pool)).slice(0, POOL_SIZE);
    return BIG_POOL;
  }

  function applyTheme(name){
    chosenTheme = name;
    themeLabel.textContent = 'Theme: ' + ({dark:'Dark',pastel:'Pastel',sunny:'Sunny',classic:'Fridge',xmas:'Christmas',light:'Light'}[name]||name);
    if(name==='pastel'){ document.body.style.background='linear-gradient(180deg,#fff7fb 0%, #fffaf6 60%)'; document.documentElement.style.setProperty('--muted','#6b5b6b'); document.documentElement.style.setProperty('--accent','#ff9ec3'); }
    else if(name==='xmas'){ document.body.style.background='linear-gradient(180deg,#07220f 0%, #07220f 60%)'; document.documentElement.style.setProperty('--muted','#cfe8d8'); document.documentElement.style.setProperty('--accent','#ff4b4b'); }
    else { document.body.style.background='linear-gradient(180deg,#0a0c0f 0%, #06070a 60%)'; document.documentElement.style.setProperty('--muted','#bfc4d6'); document.documentElement.style.setProperty('--accent','#ffb347'); }
  }

  function renderInlineWizard(){
    inlineWizard.innerHTML = '';
    const wrapper = document.createElement('div'); wrapper.style.textAlign='center';

    const title = document.createElement('div'); title.style.fontSize='1.2rem'; title.style.fontWeight='900'; title.style.color='#111'; title.textContent='New Game Setup';
    wrapper.appendChild(title);

    const desc = document.createElement('div'); desc.className='small'; desc.style.color='#444'; desc.style.marginTop='6px'; desc.textContent='Choose players, rounds, time and theme — then begin.';
    wrapper.appendChild(desc);

    // players
    const playerRow = document.createElement('div'); playerRow.className='jounty-row'; playerRow.style.marginTop='12px';
    [1,2,3,4].forEach(n=>{
      const el = document.createElement('div'); el.className='jounty-tile'; el.textContent = n + (n>1 ? ' Players' : ' Player');
      if(n===chosenPlayers) el.classList.add('selected');
      el.addEventListener('click', ()=>{ chosenPlayers=n; renderInlineWizard(); });
      playerRow.appendChild(el);
    });
    wrapper.appendChild(playerRow);

    // rounds/time
    const rt = document.createElement('div'); rt.style.display='flex'; rt.style.gap='18px'; rt.style.justifyContent='center'; rt.style.marginTop='12px';
    const roundsCol = document.createElement('div'); const roundsLabel = document.createElement('div'); roundsLabel.style.fontWeight='800'; roundsLabel.textContent='Rounds'; roundsCol.appendChild(roundsLabel);
    const roundRow = document.createElement('div'); roundRow.className='jounty-row';
    [2,4,5,10].forEach(r=>{ const el=document.createElement('div'); el.className='jounty-tile'; el.textContent=r+' Rounds'; if(r===chosenRounds) el.classList.add('selected'); el.addEventListener('click', ()=>{ chosenRounds=r; renderInlineWizard(); }); roundRow.appendChild(el); });
    roundsCol.appendChild(roundRow); rt.appendChild(roundsCol);

    const timeCol = document.createElement('div'); const timeLabel=document.createElement('div'); timeLabel.style.fontWeight='800'; timeLabel.textContent='Time'; timeCol.appendChild(timeLabel);
    const timeRow=document.createElement('div'); timeRow.className='jounty-row';
    [60,90,120].forEach(t=>{ const el=document.createElement('div'); el.className='jounty-tile'; el.textContent=t+'s'; if(t===chosenTime) el.classList.add('selected'); el.addEventListener('click', ()=>{ chosenTime=t; renderInlineWizard(); }); timeRow.appendChild(el); });
    timeCol.appendChild(timeRow); rt.appendChild(timeCol);
    wrapper.appendChild(rt);

    // theme
    const themeRow = document.createElement('div'); themeRow.className='jounty-row'; themeRow.style.marginTop='12px';
    ['dark','pastel','sunny','classic','xmas','light'].forEach(t=>{ const el=document.createElement('div'); el.className='jounty-tile'; el.textContent=t.charAt(0).toUpperCase()+t.slice(1); if(t===chosenTheme) el.classList.add('selected'); el.addEventListener('click', ()=>{ chosenTheme=t; renderInlineWizard(); }); themeRow.appendChild(el); });
    wrapper.appendChild(themeRow);

    // player slots + profile upload/save
    const slots = document.createElement('div'); slots.style.marginTop='12px';
    for(let i=0;i<chosenPlayers;i++){
      const row = document.createElement('div'); row.className='profile-row';
      const preview = document.createElement('div'); preview.id='preview_'+i; preview.style.width='56px'; preview.style.height='56px'; preview.style.borderRadius='50%'; preview.style.overflow='hidden'; preview.style.background='#eee'; preview.style.display='flex'; preview.style.alignItems='center'; preview.style.justifyContent='center';
      preview.innerHTML = uploadedImages[i] ? `<img src="${uploadedImages[i]}" style="width:100%;height:100%;object-fit:cover">` : (i+1);
      const input = document.createElement('input'); input.id='name_'+i; input.placeholder='Player '+(i+1)+' name'; input.value = playerNames[i]||DEFAULT_PLAYER_NAMES[i]; input.style.padding='8px'; input.style.borderRadius='8px'; input.style.border='1px solid rgba(0,0,0,0.06)'; input.style.minWidth='220px';
      const file = document.createElement('input'); file.type='file'; file.accept='image/*'; file.id='file_'+i;
      const saveProfileBtn = document.createElement('button'); saveProfileBtn.className='btn'; saveProfileBtn.textContent='Save Profile';
      const confirmSpan = document.createElement('span'); confirmSpan.id = 'confirm_'+i; confirmSpan.className='confirm'; confirmSpan.style.display='none';
      saveProfileBtn.addEventListener('click', ()=>{
        const nameVal = document.getElementById('name_'+i).value.trim() || DEFAULT_PLAYER_NAMES[i];
        const fileEl = document.getElementById('file_'+i);
        if(fileEl && fileEl.files && fileEl.files[0]){
          const reader = new FileReader();
          reader.onload = function(ev){
            const data = ev.target.result;
            const id = 'p_'+Date.now();
            const list = loadProfiles();
            list.push({id,name:nameVal,image:data});
            saveProfiles(list);
            uploadedImages[i] = data;
            document.getElementById('preview_'+i).innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
            document.getElementById('confirm_'+i).textContent = 'Saved';
            document.getElementById('confirm_'+i).style.display = 'inline';
            setTimeout(()=>{ document.getElementById('confirm_'+i).style.display='none'; }, 1800);
            setMessage('Profile saved: '+nameVal);
            updateScoreboard();
          };
          reader.readAsDataURL(fileEl.files[0]);
        } else {
          const id = 'p_'+Date.now();
          const list = loadProfiles();
          list.push({id,name:nameVal,image:null});
          saveProfiles(list);

          document.getElementById('confirm_'+i).textContent = 'Saved';
          document.getElementById('confirm_'+i).style.display = 'inline';
          setTimeout(()=>{ document.getElementById('confirm_'+i).style.display='none'; }, 1400);

          setMessage('Profile saved (no image): '+nameVal);
        }
      });

      row.appendChild(preview);
      row.appendChild(input);
      row.appendChild(file);
      row.appendChild(saveProfileBtn);
      row.appendChild(confirmSpan);
      slots.appendChild(row);
    }

    wrapper.appendChild(slots);

    // finish (auto-start) / cancel
    const actions = document.createElement('div');
    actions.style.display='flex';
    actions.style.justifyContent='center';
    actions.style.gap='12px';
    actions.style.marginTop='14px';

    const finishBtn = document.createElement('div');
    finishBtn.className='jounty-tile';
    finishBtn.id='finishSetupInline';
    finishBtn.textContent='Finish Setup (Auto Start)';

    const cancelBtn = document.createElement('div');
    cancelBtn.className='btn';
    cancelBtn.textContent='Cancel';
    cancelBtn.addEventListener('click', ()=>{
      inlineWizard.style.display='none';
      setMessage('Setup cancelled.');
    });

    actions.appendChild(finishBtn);
    actions.appendChild(cancelBtn);
    wrapper.appendChild(actions);

    inlineWizard.appendChild(wrapper);
    inlineWizard.style.display='block';

    if(finishBtn && !finishBtn._bound){
      finishBtn._bound = true;
      finishBtn.addEventListener('click', ()=>{
        for(let p=0;p<chosenPlayers;p++){
          const nameEl = document.getElementById('name_'+p);
          playerNames[p] = nameEl && nameEl.value.trim()
            ? nameEl.value.trim()
            : DEFAULT_PLAYER_NAMES[p];

          const fileEl = document.getElementById('file_'+p);
          if(fileEl && fileEl.files && fileEl.files[0]){
            const reader = new FileReader();
            reader.onload = function(ev){
              uploadedImages[p] = ev.target.result;
            };
            reader.readAsDataURL(fileEl.files[0]);
          }
        }

        // finalize and auto-start first round
        setTimeout(()=>{ finalizeSetup(true); }, 160);
      });
    }
  }

  function finalizeSetup(autoStart){
    totalRounds = chosenRounds;
    currentRound = 0;
    scores = loadScores().slice(0,4);
    saveScores(scores);
    updateScoreboard();
    applyTheme(chosenTheme);
    inlineWizard.style.display='none';
    generateWordMagnets();
    setMessage('Game ready.' + (autoStart ? ' Starting round 1...' : ' Press Start Game.'));
    if(autoStart){
      setTimeout(()=>{ startRound(); }, 220);
    }
  }

  function setupBoard(){
    clearBoard();
    markers = [];
    const rect = playArea.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const positions = [{x:Math.max(12,Math.round(w*0.02)),y:Math.max(12,Math.round(h*0.02))},{x:Math.max(12,Math.round(w*0.86)),y:Math.max(12,Math.round(h*0.02))},{x:Math.max(12,Math.round(w*0.02)),y:Math.max(12,Math.round(h*0.86))},{x:Math.max(12,Math.round(w*0.86)),y:Math.max(12,Math.round(h*0.86))}];
    for(let i=0;i<chosenPlayers;i++){
      const el = document.createElement('div'); el.className='player-marker marker-p'+(i+1); el.style.left=positions[i].x+'px'; el.style.top=positions[i].y+'px';
      const inner = document.createElement('div'); inner.style.width='100%'; inner.style.height='100%'; inner.style.display='flex'; inner.style.alignItems='center'; inner.style.justifyContent='center'; inner.style.fontWeight='900'; inner.style.color='#111';
      if(uploadedImages[i]){ const img=document.createElement('img'); img.className='marker-img'; img.src=uploadedImages[i]; inner.appendChild(img); } else { inner.textContent = playerNames[i] || DEFAULT_PLAYER_NAMES[i]; }
      el.appendChild(inner); playArea.appendChild(el);
      const marker = {playerIndex:i,el,x:positions[i].x,y:positions[i].y,imgSrc:uploadedImages[i]||null};
      markers.push(marker); makeMarkerDraggable(marker);
    }
    generateWordMagnets();
    setMessage('Place markers, then play proceeds automatically.');
  }

  function clearBoard(){ magnets.forEach(m=>{ if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el); }); magnets=[]; markers.forEach(m=>{ if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el); }); markers=[]; magnetId=1; }

  function generateWordMagnets(){
    wordBank.innerHTML=''; magnets.forEach(m=>{ if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el); }); magnets=[]; magnetId=1;
    const pool = buildBigPool(); const chosen = new Set();
    // include COMMON_WORDS and random picks from pool
    COMMON_WORDS.forEach(w=>chosen.add(w));
    while(chosen.size < ROUND_WORD_COUNT){
      const idx = Math.floor(Math.random()*pool.length);
      chosen.add(pool[idx]);
    }
    const words = Array.from(chosen); shuffle(words);
    const visibleCount = Math.min(VISIBLE_MAGNETS, words.length);
    const bankRect = wordBank.getBoundingClientRect(); const bankW = Math.max(600, bankRect.width || 1200); const bankH = Math.max(220, bankRect.height || 320);
    for(let i=0;i<visibleCount;i++){
      const text = words[i]; const el = document.createElement('div'); el.className='word-magnet jaunty'; el.innerHTML = `<div class="magnet-text">${escapeHtml(text)}</div>`;
      const angle = Math.round(rand(-18,18)); const scale = (rand(0.98,1.04)).toFixed(2); const x = Math.round(rand(8, bankW - 160)); const y = Math.round(rand(6, bankH - 48));
      el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = `rotate(${angle}deg) scale(${scale})`;
      // store a small random offset for ratings display
      el.dataset._angle = angle; el.dataset._scale = scale; el.dataset._x = x; el.dataset._y = y;
      wordBank.appendChild(el);
      const magnet = {id:magnetId++,text,el,inPlay:false,x,y,angle};
      magnets.push(magnet); makeMagnetDraggable(magnet);
    }
  }

  function makeMagnetDraggable(magnet){
    const el = magnet.el; let dragging=false, offsetX=0, offsetY=0;
    function onDown(e){ e.preventDefault(); dragging=true; el.style.zIndex=9999; const r=el.getBoundingClientRect(); offsetX=e.clientX-r.left; offsetY=e.clientY-r.top; try{ el.setPointerCapture(e.pointerId); }catch(e){} el.classList.add('dragging'); }
    function onMove(e){ if(!dragging) return; e.preventDefault(); let x=e.clientX-offsetX; let y=e.clientY-offsetY; const vw=Math.max(document.documentElement.clientWidth, window.innerWidth||0); const vh=Math.max(document.documentElement.clientHeight, window.innerHeight||0); x=clamp(x,0,vw-el.offsetWidth); y=clamp(y,0,vh-el.offsetHeight); el.style.left=x+'px'; el.style.top=y+'px'; if(!magnet._absolute){ magnet._absolute=true; document.body.appendChild(el); } magnet.x=x; magnet.y=y; }
    function onUp(e){ if(!dragging) return; dragging=false; el.style.zIndex=1; try{ el.releasePointerCapture(e.pointerId); }catch(e){} el.classList.remove('dragging'); const centerX = magnet.x + el.offsetWidth/2; const centerY = magnet.y + el.offsetHeight/2; const playRect = playArea.getBoundingClientRect(); const bankRect = wordBank.getBoundingClientRect();
      if(centerX >= playRect.left && centerX <= playRect.right && centerY >= playRect.top && centerY <= playRect.bottom){
        const localX = centerX - playRect.left - el.offsetWidth/2; const localY = centerY - playRect.top - el.offsetHeight/2;
        magnet.inPlay=true; magnet.x=clamp(localX,0,playRect.width-el.offsetWidth); magnet.y=clamp(localY,0,playRect.height-el.offsetHeight); playArea.appendChild(el); el.style.left=magnet.x+'px'; el.style.top=magnet.y+'px'; magnet._absolute=false; return;
      }
      if(centerX >= bankRect.left && centerX <= bankRect.right && centerY >= bankRect.top && centerY <= bankRect.bottom){
        const x = Math.round(rand(8, Math.max(80, bankRect.width - 160))); const y = Math.round(rand(6, Math.max(20, bankRect.height - 48)));
        magnet.inPlay=false; magnet.x=x; magnet.y=y; wordBank.appendChild(el); el.style.left=x+'px'; el.style.top=y+'px'; magnet._absolute=false; return;
      }
      if(magnet.inPlay){ const playRect2 = playArea.getBoundingClientRect(); magnet.x = clamp(magnet.x,0,playRect2.width-el.offsetWidth); magnet.y = clamp(magnet.y,0,playRect2.height-el.offsetHeight); playArea.appendChild(el); el.style.left=magnet.x+'px'; el.style.top=magnet.y+'px'; magnet._absolute=false; } else { const bankRect2 = wordBank.getBoundingClientRect(); const x = Math.round(rand(8, Math.max(80, bankRect2.width - 160))); const y = Math.round(rand(6, Math.max(20, bankRect2.height - 48))); magnet.inPlay=false; magnet.x=x; magnet.y=y; wordBank.appendChild(el); el.style.left=x+'px'; el.style.top=y+'px'; magnet._absolute=false; }
    }
    el.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
  }

  function startRound(){
    if(roundActive) return;
    if(currentRound === 0) setupBoard();
    roundActive=true; currentRound++; totalRounds=chosenRounds; timeLeft=chosenTime; timerDisplay.textContent = timeLeft + 's'; updateTimerBar(); setMessage(`Round ${currentRound}/${totalRounds} started — ${timeLeft}s`);
    if(timer) clearInterval(timer);
    timer = setInterval(()=>{ timeLeft--; timerDisplay.textContent = timeLeft + 's'; updateTimerBar(); if(timeLeft <= 0){ clearInterval(timer); timer=null; endRound(); } },1000);
  }

  function updateTimerBar(){ const pct = Math.max(0, Math.min(1, timeLeft / chosenTime)); timerBar.style.width = (pct*100) + '%'; if(pct < 0.25) timerBar.style.filter='hue-rotate(-20deg) saturate(1.2)'; else timerBar.style.filter=''; }

  function endRound(){
    roundActive=false; timerDisplay.textContent='0s'; timerBar.style.width='0%'; setMessage('Time! Freezing board and opening ratings...');
    magnets.forEach(m=>{ if(m.el) m.el.style.pointerEvents='none'; });
    markers.forEach(m=>{ if(m.el) m.el.style.pointerEvents='none'; });
    setTimeout(()=>{ openRatingsModal(); }, 200);
  }

  function clusterMagnets(eps){
    const threshold = eps || 140;
    const inPlay = magnets.filter(m => m.inPlay && m.el);
    const visited = new Set();
    const clusters = [];

    function centerOf(m){
      return {
        x: m.x + (m.el ? m.el.offsetWidth/2 : 0),
        y: m.y + (m.el ? m.el.offsetHeight/2 : 0)
      };
    }

    function dist(a,b){
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx*dx + dy*dy);
    }

    for(let i=0;i<inPlay.length;i++){
      const start = inPlay[i];
      if(visited.has(start)) continue;

      const queue = [start];
      visited.add(start);
      const cluster = [];

      while(queue.length){
        const cur = queue.shift();
        cluster.push(cur);
        const ccur = centerOf(cur);

        for(let j=0;j<inPlay.length;j++){
          const other = inPlay[j];
          if(visited.has(other)) continue;

          const cother = centerOf(other);
          if(dist(ccur, cother) <= threshold){
            visited.add(other);
            queue.push(other);
          }
        }
      }

      if(cluster.length) clusters.push(cluster);
    }

    return clusters;
  }

  function assignClustersToMarkers(clusters){
    const assigned = Array.from({length: chosenPlayers}, ()=>[]);
    if(!markers || markers.length===0) return assigned;

    clusters.forEach(cluster=>{
      let cx=0, cy=0;
      cluster.forEach(m=>{
        cx += m.x + (m.el ? m.el.offsetWidth/2 : 0);
        cy += m.y + (m.el ? m.el.offsetHeight/2 : 0);
      });
      cx /= cluster.length;
      cy /= cluster.length;

      let bestIdx = 0;
      let bestDist = Infinity;

      markers.forEach((mk, idx)=>{
        const mx = mk.x + (mk.el ? mk.el.offsetWidth/2 : 0);
        const my = mk.y + (mk.el ? mk.el.offsetHeight/2 : 0);
        const d = Math.hypot(mx - cx, my - cy);
        if(d < bestDist){
          bestDist = d;
          bestIdx = idx;
        }
      });

      assigned[bestIdx].push(cluster);
    });

    return assigned;
  }

  function orderMagnetsRowMajor(cluster){
    if(!cluster || !cluster.length) return [];
    const tolerance = 40;
    const copy = cluster.slice();

    copy.sort((a,b)=>{
      const ay = a.y;
      const by = b.y;
      if(Math.abs(ay - by) > tolerance) return ay - by;
      return a.x - b.x;
    });

    return copy;
  }

  function openRatingsModal(){
    const clusters = clusterMagnets(140);
    const byPlayer = assignClustersToMarkers(clusters);
    const sentencesByPlayer = byPlayer.map(playerClusters=>{
      const out=[]; playerClusters.forEach(cluster=>{ const ordered=orderMagnetsRowMajor(cluster); const text = ordered.map(m=>m.text).join(' ').trim(); if(text) out.push({magnets:ordered,text}); }); return out;
    });

    const modal = document.createElement('div'); modal.className='modal-backdrop';
    const card = document.createElement('div'); card.className='modal-card';
    let html = `<div style="font-weight:900;font-size:1.2rem">Rate the chaos</div><div style="margin-top:6px;font-size:0.9rem;color:#444">Review each player’s sentences and give them a score for this round.</div><div class="rating-grid" style="margin-top:12px">`;

    for(let p=0;p<chosenPlayers;p++){
      const sentences = sentencesByPlayer[p] || [];
      const name = escapeHtml(playerNames[p] || ('P'+(p+1)));
      html += `<div class="rating-row" data-player="${p}" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="flex:1;min-width:0"><div style="font-weight:800;margin-bottom:6px">${name}</div>`;
      if(sentences.length===0) html += `<div style="color:#777;font-size:0.9rem;margin-bottom:6px">No sentence detected — you can still rate this player manually.</div>`;
      sentences.forEach(s=>{
        html += `<div style="margin-bottom:6px">`;
        s.magnets.forEach(m=>{
          // render jaunty magnets visually similar to playboard
          const angle = (m.el && m.el.dataset && m.el.dataset._angle) ? m.el.dataset._angle : Math.round(rand(-12,12));
          const scale = (m.el && m.el.dataset && m.el.dataset._scale) ? m.el.dataset._scale : (rand(0.98,1.03)).toFixed(2);
          const jitterX = Math.round(rand(-6,6));
          const jitterY = Math.round(rand(-4,4));
          html += `<span class="modal-magnet" style="display:inline-block;transform:translate(${jitterX}px,${jitterY}px) rotate(${angle}deg) scale(${scale});">${escapeHtml(m.text)}</span>`;
        });
        html += `</div>`;
      });
      html += `</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div style="font-size:0.8rem;color:#666">Round score</div>
        <div>`;

      for(let score=1; score<=5; score++){
        html += `<button class="pill" data-player="${p}" data-score="${score}">${score}</button>`;
      }

      html += `</div></div></div>`;
    }

    html += `</div>
      <div style="display:flex;justify-content:flex-end;margin-top:14px;gap:8px">
        <button id="ratingsCancel" class="btn">Skip ratings</button>
        <div id="ratingsSubmit" class="jounty-tile">Submit ratings</div>
      </div>`;

    card.innerHTML = html;
    modal.appendChild(card);
    document.body.appendChild(modal);

    const ratingsMap = {};

    // score selection
    card.querySelectorAll('.pill').forEach(btn=>{
      btn.addEventListener('click', ev=>{
        const b = ev.currentTarget;
        const player = parseInt(b.dataset.player, 10);
        const score = parseInt(b.dataset.score, 10);

        ratingsMap[player] = score;

        card.querySelectorAll(`.pill[data-player="${player}"]`)
            .forEach(p=>p.classList.remove('selected'));

        b.classList.add('selected');
      });
    });

    const submitBtn = card.querySelector('#ratingsSubmit');
    const cancelBtn = card.querySelector('#ratingsCancel');

    submitBtn.addEventListener('click', ()=>{
      const deltas = Array.from({length: chosenPlayers}, ()=>0);

      Object.keys(ratingsMap).forEach(k=>{
        const idx = parseInt(k,10);
        deltas[idx] = ratingsMap[idx] || 0;
      });

      const anyRated = deltas.some(d=>d!==0);

      if(!anyRated){
        setMessage('No ratings given — skipping scoring for this round.');
        if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
        showWinnerAndAdvance(null);
        return;
      }

      // apply scores
      for(let i=0;i<chosenPlayers;i++){
        scores[i] = (scores[i] || 0) + (deltas[i] || 0);
      }

      // detect winner(s)
      let max = -Infinity;
      for(let i=0;i<chosenPlayers;i++){
        if(deltas[i] > max) max = deltas[i];
      }

      const topIndexes = [];
      for(let i=0;i<chosenPlayers;i++){
        if(deltas[i] === max && max > 0){
          topIndexes.push(i);
        }
      }

      // draw bonus
      if(topIndexes.length > 1){
        topIndexes.forEach(i=>{
          scores[i] = (scores[i] || 0) + 1;
        });
      }

      saveScores(scores);
      updateScoreboard();

      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);

      if(topIndexes.length > 1) showWinnerAndAdvance(topIndexes);
      else if(topIndexes.length === 1) showWinnerAndAdvance(topIndexes[0]);
      else showWinnerAndAdvance(null);
    });

    cancelBtn.addEventListener('click', ()=>{
      setMessage('Ratings skipped. No score changes this round.');
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      showWinnerAndAdvance(null);
    });

    function onKey(e){
      if(e.key === 'Escape'){
        if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
        window.removeEventListener('keydown', onKey);
        showWinnerAndAdvance(null);
      }
    }

    window.addEventListener('keydown', onKey);
  }
  function showWinnerAndAdvance(winner){
    // winner may be null, a single index, or an array of indexes
    const modal = document.createElement('div'); modal.className='modal-backdrop';
    const card = document.createElement('div'); card.className='modal-card';
    let html = `<div style="font-weight:900;font-size:1.2rem">Round results</div><div style="margin-top:8px;color:#444">`;

    if(winner === null){
      html += `<div style="margin-bottom:8px">No clear winner this round.</div>`;
    } else if(Array.isArray(winner)){
      html += `<div style="margin-bottom:8px">Tie between: ${winner.map(i=>escapeHtml(playerNames[i]||('P'+(i+1)))).join(', ')}</div>`;
    } else {
      html += `<div style="margin-bottom:8px">Winner: ${escapeHtml(playerNames[winner]||('P'+(winner+1)))}</div>`;
    }

    html += `<div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
      <div id="nextRoundBtn" class="jounty-tile">Next round</div>
      <div id="endGameBtn" class="btn">End game</div>
    </div>`;

    card.innerHTML = html;
    modal.appendChild(card);
    document.body.appendChild(modal);

    document.getElementById('nextRoundBtn').addEventListener('click', ()=>{
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      if(currentRound < totalRounds){
        setMessage(`Starting round ${currentRound+1}...`);
        generateWordMagnets();
        setTimeout(()=>{ startRound(); }, 180);
      } else {
        // all rounds done
        showFinalScores();
      }
    });

    document.getElementById('endGameBtn').addEventListener('click', ()=>{
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      showFinalScores();
    });
  }

  function showFinalScores(){
    const modal = document.createElement('div'); modal.className='modal-backdrop';
    const card = document.createElement('div'); card.className='modal-card';
    let html = `<div style="font-weight:900;font-size:1.2rem">Final scores</div><div style="margin-top:8px;color:#444">`;
    const pairs = [];
    for(let i=0;i<chosenPlayers;i++){
      pairs.push({i,score:scores[i]||0});
    }
    pairs.sort((a,b)=>b.score-a.score);
    pairs.forEach(p=>{
      html += `<div style="margin-bottom:6px;font-weight:800">${escapeHtml(playerNames[p.i]||('P'+(p.i+1)))} — ${p.score} pts</div>`;
    });
    html += `<div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <div id="playAgain" class="jounty-tile">Play again</div>
      <div id="closeFinal" class="btn">Close</div>
    </div>`;
    card.innerHTML = html;
    modal.appendChild(card);
    document.body.appendChild(modal);

    document.getElementById('playAgain').addEventListener('click', ()=>{
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      // reset scores and rounds
      scores = [0,0,0,0];
      saveScores(scores);
      updateScoreboard();
      currentRound = 0;
      generateWordMagnets();
      setMessage('New game ready. Press Start Game.');
    });

    document.getElementById('closeFinal').addEventListener('click', ()=>{
      if(modal && modal.parentNode) modal.parentNode.removeChild(modal);
      setMessage('Game ended.');
    });
  }

  function makeMarkerDraggable(marker){
    const el = marker.el; let dragging=false, offsetX=0, offsetY=0;
    function onDown(e){ e.preventDefault(); dragging=true; el.style.zIndex=9999; const r=el.getBoundingClientRect(); offsetX=e.clientX-r.left; offsetY=e.clientY-r.top; try{ el.setPointerCapture(e.pointerId); }catch(e){} el.classList.add('dragging'); }
    function onMove(e){ if(!dragging) return; e.preventDefault(); let x=e.clientX-offsetX; let y=e.clientY-offsetY; const playRect = playArea.getBoundingClientRect(); x = clamp(x, playRect.left, playRect.left + playRect.width - el.offsetWidth); y = clamp(y, playRect.top, playRect.top + playRect.height - el.offsetHeight); el.style.left = (x - playRect.left) + 'px'; el.style.top = (y - playRect.top) + 'px'; marker.x = x - playRect.left; marker.y = y - playRect.top; }
    function onUp(e){ if(!dragging) return; dragging=false; el.style.zIndex=1; try{ el.releasePointerCapture(e.pointerId); }catch(e){} el.classList.remove('dragging'); }
    el.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
  }

  function updateScoreboard(){
    scoreboardEl.innerHTML = '';
    for(let i=0;i<chosenPlayers;i++){
      const pill = document.createElement('div'); pill.className='score-pill'; pill.textContent = `${playerNames[i] || DEFAULT_PLAYER_NAMES[i]}: ${scores[i]||0}`;
      pill.addEventListener('click', ()=>{ setMessage(`${playerNames[i]||DEFAULT_PLAYER_NAMES[i]} — ${scores[i]||0} pts`); });
      scoreboardEl.appendChild(pill);
    }
  }

  // UI wiring
  reshuffleBtn.addEventListener('click', ()=>{
    generateWordMagnets();
    setMessage('New word mix generated.');
  });

  openNewGameBtn.addEventListener('click', ()=>{
    renderInlineWizard();
  });

  // start game button (in top controls)
  function renderStartButton(){
    startGameWrap.innerHTML = '';
    const btn = document.createElement('button'); btn.className='btn-primary'; btn.textContent='Start Round';
    btn.addEventListener('click', ()=>{ startRound(); });
    startGameWrap.appendChild(btn);
  }

  // initial setup
  function init(){
    applyTheme(chosenTheme);
    updateScoreboard();
    renderStartButton();
    generateWordMagnets();
    setMessage('Ready. Press New Game to configure players or Start Round to begin.');
  }

  // expose a small helper for emergency unblocking in console
  window.mm_debug = {
    clearStorage: ()=>{ localStorage.clear(); setMessage('localStorage cleared'); },
    regen: ()=>{ BIG_POOL=null; generateWordMagnets(); setMessage('Pool regenerated'); }
  };

  // start
  init();

})();
</script>
